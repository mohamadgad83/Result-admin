<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الطالب — مدرسة دشنا الثانوية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<style>
.admin-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-bottom:15px;border-bottom:2px solid #eee;margin-bottom:20px}
.btn{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:600;transition:all .2s;font-family:inherit}
.btn:hover{transform:translateY(-1px)}
.btn-gray{background:#6c757d;color:#fff}.btn-gray:hover{background:#5a6268}
.btn-red{background:#dc3545;color:#fff}.btn-red:hover{background:#a71d2a}
.btn-blue{background:#17a2b8;color:#fff}.btn-blue:hover{background:#138496}
.btn-green{background:#28a745;color:#fff}.btn-green:hover{background:#1e7e34}
.btn-yellow{background:#ffc107;color:#333}.btn-yellow:hover{background:#e0a800}
.btn-purple{background:#6f42c1;color:#fff}.btn-purple:hover{background:#5a32a3}
.btn-sm{padding:6px 12px;font-size:12px}

/* Quick actions bar */
.quick-bar{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px;background:linear-gradient(135deg,#f8fafc,#eef2f7);border:1px solid #e2e8f0;border-radius:14px;margin-bottom:20px;align-items:center}
.quick-bar .title{font-size:12px;font-weight:800;color:#64748b;margin-left:8px}

/* Alert box */
.alert-box{padding:14px 18px;border-radius:12px;margin-bottom:16px;font-size:13px;font-weight:600;line-height:1.7;display:flex;gap:10px;align-items:flex-start}
.alert-box.warning{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E}
.alert-box.info{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E40AF}
.alert-box .icon{font-size:18px;flex-shrink:0;margin-top:1px}

/* Cards */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
.detail-card{background:#f8f9fa;padding:20px;border-radius:14px;border:1px solid #e9ecef;position:relative}
.detail-card h3{color:#1e3c72;margin:0 0 15px;padding-bottom:10px;border-bottom:2px solid #1e3c72;font-size:16px;display:flex;align-items:center;gap:8px}
.detail-card h3 .badge-count{font-size:11px;background:#1e3c72;color:#fff;padding:2px 10px;border-radius:20px;font-weight:700;margin-right:auto}

.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;gap:10px;align-items:center}
.row:last-child{border-bottom:none}
.row .lbl{color:#666;font-size:14px;flex-shrink:0}
.row .val{font-weight:700;color:#1e3c72;text-align:left;word-break:break-word;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* Status badge */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700}
.badge.green{background:#d4edda;color:#155724}
.badge.yellow{background:#fff3cd;color:#856404}
.badge.blue{background:#cce5ff;color:#004085}
.badge.purple{background:#e7e0f5;color:#4a2d8c}
.badge.red{background:#f8d7da;color:#721c24}

/* Login method card */
.login-method-card{
  background:#fff;border-radius:14px;padding:18px;
  border:2px solid #e2e8f0;margin-bottom:16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.login-method-card.method-national{border-color:#BFDBFE;background:#EFF6FF}
.login-method-card.method-password{border-color:#A7F3D0;background:#ECFDF5}
.login-method-card .icon-box{
  width:52px;height:52px;border-radius:14px;
  display:grid;place-items:center;font-size:26px;flex-shrink:0;
}
.login-method-card.method-national .icon-box{background:#DBEAFE}
.login-method-card.method-password .icon-box{background:#D1FAE5}
.login-method-card .info{flex:1;min-width:180px}
.login-method-card .info .title{font-size:15px;font-weight:800;color:#1e3c72;margin-bottom:4px}
.login-method-card .info .desc{font-size:12px;color:#64748b;line-height:1.6}
.login-method-card .action-btn{
  padding:10px 16px;border:none;border-radius:10px;
  font-weight:700;font-size:13px;cursor:pointer;transition:all .2s;
  white-space:nowrap;
}
.login-method-card.method-password .action-btn{background:#dc3545;color:#fff}
.login-method-card.method-password .action-btn:hover{background:#a71d2a;transform:translateY(-1px)}

/* Edit requests */
.edit-request-card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:14px;margin-bottom:10px;border-right:4px solid #ffc107}
.edit-request-card.approved{border-right-color:#28a745;background:#f0fff4}
.edit-request-card.rejected{border-right-color:#dc3545;background:#fff5f5}
.edit-request-card .title{font-weight:700;color:#1e3c72;font-size:14px;margin-bottom:6px}
.edit-request-card .change{font-size:13px;margin:6px 0}
.edit-request-card .change .old{color:#dc3545;text-decoration:line-through;background:#fee;padding:2px 8px;border-radius:6px}
.edit-request-card .change .new{color:#28a745;font-weight:700;background:#d4edda;padding:2px 8px;border-radius:6px}
.edit-request-card .status{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700;margin-bottom:6px}
.edit-request-card .status.pending{background:#fff3cd;color:#856404}
.edit-request-card .status.approved{background:#d4edda;color:#155724}
.edit-request-card .status.rejected{background:#f8d7da;color:#721c24}

.edit-requests-stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.edit-requests-stats .stat{
  padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;
}
.edit-requests-stats .stat.pending{background:#fff3cd;color:#856404}
.edit-requests-stats .stat.approved{background:#d4edda;color:#155724}
.edit-requests-stats .stat.rejected{background:#f8d7da;color:#721c24}

/* Dynamic fields */
.fields-group{margin-bottom:20px}
.fields-group:last-child{margin-bottom:0}
.fields-group .group-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;background:linear-gradient(135deg,#1e3c72,#2a5298);
  color:#fff;border-radius:10px;margin-bottom:10px;
  font-weight:800;font-size:14px;
}
.fields-group .group-header .counter{
  font-size:11px;background:rgba(255,255,255,.2);padding:2px 10px;
  border-radius:12px;font-weight:600;
}
.fields-group .field-row{
  display:flex;justify-content:space-between;padding:8px 14px;
  border-bottom:1px solid #f0f0f0;font-size:13px;gap:10px;
}
.fields-group .field-row:last-child{border-bottom:none}
.fields-group .field-row .lbl{color:#666;font-weight:600}
.fields-group .field-row .val{color:#1e3c72;font-weight:700;text-align:left;word-break:break-word}
.fields-group .field-row .empty{color:#bbb;font-style:italic}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{background:#fff;border-radius:16px;padding:26px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-content h3{color:#1e3c72;margin:0 0 12px;font-size:18px}
.modal-content .warning-block{padding:14px;background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;font-size:13px;color:#991B1B;line-height:1.7;margin:12px 0}
.modal-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.modal-actions button{flex:1;min-width:100px;padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;transition:all .2s}
.modal-actions .btn-confirm{background:#dc3545;color:#fff}
.modal-actions .btn-confirm:hover{background:#a71d2a}
.modal-actions .btn-cancel{background:#6c757d;color:#fff}
.modal-actions .btn-cancel:hover{background:#5a6268}

/* Loading */
.loading-box{text-align:center;padding:60px 20px}
.loading-box .spinner{width:40px;height:40px;border:4px solid #e9ecef;border-top-color:#1e3c72;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-box p{color:#666;font-weight:600}

/* Empty state */
.empty-state{text-align:center;padding:30px;color:#999;font-size:14px}
.empty-state .icon{font-size:36px;display:block;margin-bottom:8px;opacity:.5}

@media(max-width:700px){
  .detail-grid{grid-template-columns:1fr}
  .quick-bar{flex-direction:column;align-items:stretch}
  .quick-bar .btn{width:100%;justify-content:center}
  .login-method-card{flex-direction:column;text-align:center}
  .login-method-card .action-btn{width:100%}
  .edit-requests-stats{flex-direction:column}
}
@media print{
  .admin-header button,.quick-bar,.btn{display:none !important}
  .detail-card{break-inside:avoid}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="container" style="max-width:1050px;">
<div class="card">

  <!-- ===== Header ===== -->
  <div class="admin-header">
    <div>
      <h1 style="margin:0;font-size:22px;">👨‍🎓 تفاصيل الطالب</h1>
      <p style="color:#666;font-size:13px;margin:5px 0 0;" id="headerSub">—</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a href="admin-students.html" class="btn btn-gray">🔙 القائمة</a>
      <a href="admin-dashboard.html" class="btn btn-gray">📊 لوحة التحكم</a>
      <button class="btn btn-red" onclick="Auth.adminLogout()">🚪 خروج</button>
    </div>
  </div>

  <!-- ===== Loading ===== -->
  <div id="loading" class="loading-box">
    <div class="spinner"></div>
    <p>جاري تحميل البيانات...</p>
  </div>

  <!-- ===== Content ===== -->
  <div id="content" style="display:none;">

    <!-- ===== Quick Actions ===== -->
    <div class="quick-bar" id="quickBar">
      <span class="title">⚡ إجراءات سريعة:</span>
      <button class="btn btn-sm btn-yellow" id="btnToggleLock" onclick="toggleLock()">—</button>
      <a class="btn btn-sm btn-blue" id="btnPDF" href="#" target="_blank">📄 PDF</a>
      <button class="btn btn-sm btn-purple" onclick="window.print()">🖨️ طباعة</button>
      <button class="btn btn-sm btn-gray" onclick="copyStudentInfo()">📋 نسخ البيانات</button>
    </div>

    <!-- ===== Alert: Login Method ===== -->
    <div id="loginMethodSection"></div>

    <!-- ===== Basic Info + Status ===== -->
    <div class="detail-grid">
      <div class="detail-card">
        <h3>📋 المعلومات الأساسية</h3>
        <div id="basicInfo"></div>
      </div>
      <div class="detail-card">
        <h3>⚙️ الحالة والإجراءات</h3>
        <div id="statusInfo"></div>
      </div>
    </div>

    <!-- ===== System Info ===== -->
    <div class="detail-card" style="margin-top:0;">
      <h3>🔧 معلومات النظام</h3>
      <div id="systemInfo"></div>
    </div>

    <!-- ===== Edit Requests ===== -->
    <div class="detail-card" id="editRequestsCard" style="display:none;margin-top:20px;">
      <h3>📩 طلبات التعديل <span class="badge-count" id="editRequestsCount">0</span></h3>
      <div class="edit-requests-stats" id="editRequestsStats"></div>
      <div id="editRequestsInfo"></div>
    </div>

    <!-- ===== Dynamic Fields ===== -->
    <div class="detail-card" id="fieldsCard" style="display:none;margin-top:20px;">
      <h3>📝 الحقول الديناميكية <span class="badge-count" id="fieldsCount">0</span></h3>
      <div id="fieldsInfo"></div>
    </div>

  </div>
</div>
</div>

<!-- ===== Confirm Modal ===== -->
<div class="modal" id="confirmModal">
  <div class="modal-content">
    <h3 id="confirmTitle">تأكيد الإجراء</h3>
    <div id="confirmMessage"></div>
    <div class="modal-actions">
      <button class="btn-confirm" id="confirmBtn" onclick="executeConfirm()">✅ تأكيد</button>
      <button class="btn-cancel" onclick="closeConfirm()">إلغاء</button>
    </div>
  </div>
</div>

<script src="lib/supabase.js"></script>
<script src="lib/auth.js"></script>
<script src="lib/toast.js"></script>
<script src="lib/escape.js"></script>
<script>
let student = null;
let fields = [];
let responses = {};
let editRequests = [];
let auth0 = null;
let pendingAction = null;

// ===== Init =====
(async () => {
  auth0 = await Auth.requireAdmin();
  if (!auth0) return;
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { location.href = 'admin-students.html'; return; }
  await load(id);
})();

// ===== Load All Data =====
async function load(id) {
  try {
    // جلب الطالب
    const { data: s, error: sErr } = await SB.from('students').select('*').eq('id', id).single();
    if (sErr || !s) {
      Toast.show('الطالب غير موجود', 'error');
      setTimeout(() => location.href = 'admin-students.html', 1500);
      return;
    }
    student = s;

    // جلب الحقول الديناميكية
    const { data: f } = await SB.from('dynamic_fields')
      .select('*, form_sections(name, display_order)')
      .eq('visible_for_student', true)
      .order('display_order');

    fields = (f || []).map(x => ({
      ...x,
      section_name: x.form_sections?.name || null,
      section_order: x.form_sections?.display_order ?? 999
    }));

    // جلب الاستجابات
    const { data: r } = await SB.from('student_dynamic_responses')
      .select('field_id,value').eq('student_id', id);
    (r || []).forEach(x => { responses[x.field_id] = x.value; });

    // جلب طلبات التعديل
    const { data: er } = await SB.from('edit_requests')
      .select('*').eq('student_id', id).order('requested_at', { ascending: false });
    editRequests = er || [];

    render();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

  } catch (err) {
    console.error(err);
    Toast.show('خطأ في التحميل: ' + err.message, 'error');
    document.getElementById('loading').innerHTML =
      '<p style="color:#dc3545;">❌ حدث خطأ في تحميل البيانات<br><small>' + esc(err.message) + '</small></p>';
  }
}

// ===== Render Main =====
function render() {
  const s = student;
  const masked = '****' + String(s.national_id || '').slice(-4);

  // Header sub
  document.getElementById('headerSub').textContent = `${s.full_name || ''} • ${s.student_code || ''}`;

  // Quick actions
  const btnLock = document.getElementById('btnToggleLock');
  btnLock.textContent = s.is_locked ? '🔓 فتح التعديل' : '🔒 قفل التعديل';
  btnLock.className = 'btn btn-sm ' + (s.is_locked ? 'btn-green' : 'btn-yellow');

  document.getElementById('btnPDF').href = `student-pdf.html?print=${s.id}`;

  // Login Method Section
  renderLoginMethodSection(s);

  // Basic Info
  document.getElementById('basicInfo').innerHTML = `
    <div class="row"><span class="lbl">الاسم</span><span class="val">${esc(s.full_name || '—')}</span></div>
    <div class="row"><span class="lbl">الكود</span><span class="val" dir="ltr">${esc(s.student_code || '—')}</span></div>
    <div class="row"><span class="lbl">الرقم القومي</span><span class="val" dir="ltr">${esc(masked)}</span></div>
    <div class="row"><span class="lbl">الصف</span><span class="val">${esc(s.grade || '—')}</span></div>
    <div class="row"><span class="lbl">حالة القيد</span><span class="val">${esc(s.enrollment_status || '—')}</span></div>
    <div class="row"><span class="lbl">النوع</span><span class="val">${esc(s.gender || '—')}</span></div>
    <div class="row"><span class="lbl">تاريخ الميلاد</span><span class="val">${s.date_of_birth ? new Date(s.date_of_birth).toLocaleDateString('ar-EG', {year:'numeric',month:'long',day:'numeric'}) : '—'}</span></div>
    <div class="row"><span class="lbl">المحافظة</span><span class="val">${esc(s.governorate || '—')}</span></div>
    <div class="row"><span class="lbl">التشعيب</span><span class="val">${esc(s.stream || '—')}</span></div>
    ${s.stream === 'ثانوي' ? `<div class="row"><span class="lbl">التخصص</span><span class="val">${esc(s.specialization || '—')}</span></div>` : ''}
    ${s.stream === 'بكالوريا' ? `
      <div class="row"><span class="lbl">المسار</span><span class="val">${esc(s.track || '—')}</span></div>
      <div class="row"><span class="lbl">المادة الاختيارية</span><span class="val">${esc(s.optional_subject || '—')}</span></div>
    ` : ''}
  `;

  // Status Info
  const lockBadge = s.is_locked
    ? '<span class="badge green">🔒 مقفل</span>'
    : '<span class="badge yellow">🔓 مفتوح</span>';
  const submitDate = s.submitted_at
    ? new Date(s.submitted_at).toLocaleString('ar-EG')
    : '—';

  document.getElementById('statusInfo').innerHTML = `
    <div class="row"><span class="lbl">حالة القفل</span><span class="val">${lockBadge}</span></div>
    <div class="row"><span class="lbl">تاريخ التقديم</span><span class="val">${submitDate}</span></div>
    <div class="row"><span class="lbl">طريقة الدخول</span><span class="val">${
      s.login_method === 'password'
        ? '<span class="badge purple">🔑 كلمة سر</span>'
        : '<span class="badge blue">🆔 رقم قومي</span>'
    }</span></div>
    <div class="row"><span class="lbl">حساب نشط</span><span class="val">${
      s.is_active !== false ? '<span class="badge green">✅ نشط</span>' : '<span class="badge red">❌ معطل</span>'
    }</span></div>
  `;

  // System Info
  document.getElementById('systemInfo').innerHTML = `
    <div class="row"><span class="lbl">تاريخ الإنشاء</span><span class="val">${s.created_at ? new Date(s.created_at).toLocaleString('ar-EG') : '—'}</span></div>
    <div class="row"><span class="lbl">آخر تحديث</span><span class="val">${s.updated_at ? new Date(s.updated_at).toLocaleString('ar-EG') : '—'}</span></div>
    <div class="row"><span class="lbl">معرف الطالب (UUID)</span><span class="val" dir="ltr" style="font-size:11px;font-family:monospace;">${esc(s.id)}</span></div>
  `;

  // Edit Requests
  renderEditRequests();

  // Dynamic Fields
  renderFields();
}

// ===== Login Method Card =====
function renderLoginMethodSection(s) {
  const el = document.getElementById('loginMethodSection');

  if (s.login_method === 'password') {
    el.innerHTML = `
      <div class="login-method-card method-password">
        <div class="icon-box">🔑</div>
        <div class="info">
          <div class="title">الدخول بكلمة السر</div>
          <div class="desc">الطالب يستخدم كلمة سر للدخول. الرقم القومي معطل حالياً. يمكنك إعادة التعيين للرجوع للرقم القومي.</div>
        </div>
        <button class="action-btn" onclick="confirmResetLogin()">🔄 إعادة الدخول بالرقم القومي</button>
      </div>
    `;
  } else {
    el.innerHTML = `
      <div class="login-method-card method-national">
        <div class="icon-box">🆔</div>
        <div class="info">
          <div class="title">الدخول بالرقم القومي</div>
          <div class="desc">الطالب يستخدم الرقم القومي للدخول. يمكنه إنشاء كلمة سر من لوحته لزيادة الخصوصية.</div>
        </div>
      </div>
    `;
  }
}

// ===== Edit Requests =====
function renderEditRequests() {
  const card = document.getElementById('editRequestsCard');
  const container = document.getElementById('editRequestsInfo');
  const statsEl = document.getElementById('editRequestsStats');
  const countEl = document.getElementById('editRequestsCount');

  if (editRequests.length === 0) {
    card.style.display = 'none';
    return;
  }

  card.style.display = 'block';
  countEl.textContent = editRequests.length;

  // Stats
  const pending = editRequests.filter(r => r.status === 'pending').length;
  const approved = editRequests.filter(r => r.status === 'approved').length;
  const rejected = editRequests.filter(r => r.status === 'rejected').length;

  statsEl.innerHTML = `
    ${pending > 0 ? `<span class="stat pending">⏳ ${pending} معلق</span>` : ''}
    ${approved > 0 ? `<span class="stat approved">✅ ${approved} موافق</span>` : ''}
    ${rejected > 0 ? `<span class="stat rejected">❌ ${rejected} مرفوض</span>` : ''}
  `;

  const labels = { pending: '⏳ معلق', approved: '✅ موافق', rejected: '❌ مرفوض' };

  container.innerHTML = editRequests.map(r => `
    <div class="edit-request-card ${r.status}">
      <span class="status ${r.status}">${labels[r.status]}</span>
      <div class="title">${esc(r.field_label)}</div>
      <div class="change">
        <span class="old">${esc(r.old_value || '—')}</span>
        → <span class="new">${esc(r.new_value)}</span>
      </div>
      <div style="font-size:12px;color:#666;margin-top:6px;">📝 <strong>السبب:</strong> ${esc(r.reason)}</div>
      ${r.admin_response ? `<div style="font-size:12px;color:#555;margin-top:6px;padding:8px;background:#e8f4fd;border-radius:6px;"><strong>📩 رد الإدارة:</strong> ${esc(r.admin_response)}</div>` : ''}
      <div style="font-size:11px;color:#999;margin-top:6px;">
        📅 ${new Date(r.requested_at).toLocaleString('ar-EG')}
        ${r.responded_at ? ` • ✅ ${new Date(r.responded_at).toLocaleString('ar-EG')}` : ''}
      </div>
      ${r.status === 'pending' ? `
        <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-sm btn-green" onclick="respondEditRequest('${r.id}', 'approved')">✅ موافقة</button>
          <button class="btn btn-sm btn-red" onclick="respondEditRequest('${r.id}', 'rejected')">❌ رفض</button>
        </div>
      ` : ''}
    </div>
  `).join('');
}

// ===== Dynamic Fields =====
function renderFields() {
  const card = document.getElementById('fieldsCard');
  const container = document.getElementById('fieldsInfo');
  const countEl = document.getElementById('fieldsCount');

  if (fields.length === 0) {
    card.style.display = 'none';
    return;
  }

  card.style.display = 'block';
  countEl.textContent = fields.length;

  // تجميع حسب القسم
  const groups = {};
  fields.forEach(f => {
    const key = f.section_id || '__none__';
    if (!groups[key]) {
      groups[key] = { name: f.section_name || 'بدون قسم', order: f.section_order ?? 999, fields: [] };
    }
    groups[key].fields.push(f);
  });

  const sortedKeys = Object.keys(groups).sort((a, b) => {
    if (a === '__none__') return -1;
    if (b === '__none__') return 1;
    return (groups[a].order || 999) - (groups[b].order || 999);
  });

  let html = '';
  sortedKeys.forEach(key => {
    const g = groups[key];
    const filled = g.fields.filter(f => (responses[f.id] || '').trim() !== '').length;

    html += `<div class="fields-group">
      <div class="group-header">
        <span>📂 ${esc(g.name)}</span>
        <span class="counter">${filled}/${g.fields.length} مكتمل</span>
      </div>`;

    g.fields.forEach(f => {
      const val = responses[f.id];
      const isEmpty = !val || val.trim() === '';
      html += `<div class="field-row">
        <span class="lbl">${esc(f.name)}${f.is_readonly ? ' 🔒' : ''}</span>
        <span class="val ${isEmpty ? 'empty' : ''}">${isEmpty ? '— لم يُملأ —' : esc(val)}</span>
      </div>`;
    });

    html += `</div>`;
  });

  container.innerHTML = html;
}

// ===== Toggle Lock =====
async function toggleLock() {
  const s = student;
  const newLock = !s.is_locked;
  const action = newLock ? 'قفل' : 'فتح';

  if (!confirm(`هل أنت متأكد من ${action} الاستمارة لهذا الطالب؟`)) return;

  try {
    const { error } = await SB.from('students').update({
      is_locked: newLock,
      submitted_at: newLock ? s.submitted_at : null
    }).eq('id', s.id);

    if (error) throw error;

    await SB.from('admin_logs').insert({
      admin_id: auth0.user.id,
      admin_email: auth0.user.email,
      action: `${action} طالب`,
      details: `${action} ${s.full_name}`,
      student_id: s.id,
      student_name: s.full_name
    });

    Toast.show(`✅ تم ${action} الطالب`);

    // Reload
    await reloadStudent();
  } catch (err) {
    console.error(err);
    Toast.show('خطأ: ' + err.message, 'error');
  }
}

// ===== Reset Login Method (Confirm Modal) =====
function confirmResetLogin() {
  pendingAction = 'resetLogin';
  document.getElementById('confirmTitle').textContent = '🔄 إعادة الدخول بالرقم القومي';
  document.getElementById('confirmMessage').innerHTML = `
    <div class="warning-block">
      <strong>⚠️ تحذير:</strong><br>
      سيتم <strong>إلغاء كلمة السر</strong> الخاصة بالطالب (${esc(student.full_name)}) نهائياً.<br><br>
      <strong>ما سيحدث:</strong><br>
      • ستُحذف كلمة السر من قاعدة البيانات<br>
      • ستُغلق كل الجلسات النشطة لهذا الطالب<br>
      • الطالب سيدخل بالرقم القومي في المرة القادمة<br>
      • يمكنه إنشاء كلمة سر جديدة من لوحته لاحقاً
    </div>
  `;
  document.getElementById('confirmModal').classList.add('show');
}

function closeConfirm() {
  document.getElementById('confirmModal').classList.remove('show');
  pendingAction = null;
}

async function executeConfirm() {
  if (pendingAction === 'resetLogin') {
    await resetLoginMethod();
  }
  closeConfirm();
}

async function resetLoginMethod() {
  if (!student) return;

  try {
    const { data, error } = await SB.rpc('admin_reset_student_login', {
      p_student_id: student.id
    });

    if (error || !data?.ok) {
      Toast.show('خطأ: ' + (data?.error || error?.message || 'فشل الإجراء'), 'error');
      return;
    }

    // سجل النشاط
    await SB.from('admin_logs').insert({
      admin_id: auth0.user.id,
      admin_email: auth0.user.email,
      action: 'إعادة تعيين طريقة الدخول',
      details: `${student.full_name} — من كلمة سر إلى رقم قومي`,
      student_id: student.id,
      student_name: student.full_name
    });

    Toast.show('✅ تم — الطالب سيدخل بالرقم القومي الآن', 'success', 3000);

    // Reload
    await reloadStudent();
  } catch (err) {
    console.error(err);
    Toast.show('خطأ: ' + err.message, 'error');
  }
}

// ===== Respond to Edit Request =====
async function respondEditRequest(id, action) {
  const req = editRequests.find(r => r.id === id);
  if (!req) return;

  const msg = action === 'approved'
    ? `الموافقة على تعديل "${req.field_label}"؟\n\nسيتم تحديث القيمة من: ${req.old_value || '—'}\nإلى: ${req.new_value}`
    : `رفض طلب التعديل "${req.field_label}"؟`;

  if (!confirm(msg)) return;

  try {
    // تطبيق التعديل أولاً (إذا موافقة)
    if (action === 'approved') {
      if (req.target_type === 'core') {
        const updateData = { [req.field_key]: req.new_value };
        const { error: e1 } = await SB.from('students').update(updateData).eq('id', req.student_id);
        if (e1) throw e1;
      } else if (req.target_type === 'dynamic' && req.field_id) {
        const { error: e2 } = await SB.from('student_dynamic_responses').upsert({
          student_id: req.student_id,
          field_id: req.field_id,
          value: req.new_value
        }, { onConflict: 'student_id,field_id' });
        if (e2) throw e2;
      }
    }

    // تحديث الطلب
    const { error: e3 } = await SB.from('edit_requests').update({
      status: action,
      responded_at: new Date().toISOString(),
      admin_id: auth0.user.id
    }).eq('id', id);
    if (e3) throw e3;

    // سجل النشاط
    await SB.from('admin_logs').insert({
      admin_id: auth0.user.id,
      admin_email: auth0.user.email,
      action: action === 'approved' ? 'موافقة على تعديل' : 'رفض تعديل',
      details: `${req.field_label}: ${req.old_value} → ${req.new_value}`,
      student_id: req.student_id,
      student_name: student.full_name
    });

    Toast.show(action === 'approved' ? '✅ تمت الموافقة والتحديث' : '❌ تم الرفض', 'success');

    // Reload
    await reloadStudent();
  } catch (err) {
    console.error(err);
    Toast.show('خطأ: ' + err.message, 'error');
  }
}

// ===== Copy Student Info =====
function copyStudentInfo() {
  if (!student) return;
  const s = student;
  const masked = '****' + String(s.national_id || '').slice(-4);
  const text = [
    `الاسم: ${s.full_name || ''}`,
    `الكود: ${s.student_code || ''}`,
    `الرقم القومي: ${masked}`,
    `الصف: ${s.grade || ''}`,
    `حالة القيد: ${s.enrollment_status || ''}`,
    `النوع: ${s.gender || ''}`,
    `المحافظة: ${s.governorate || ''}`,
    `التشعيب: ${s.stream || ''}`,
    s.specialization ? `التخصص: ${s.specialization}` : '',
    s.track ? `المسار: ${s.track}` : '',
    s.optional_subject ? `المادة الاختيارية: ${s.optional_subject}` : '',
    `طريقة الدخول: ${s.login_method === 'password' ? 'كلمة سر' : 'رقم قومي'}`,
    `الحالة: ${s.is_locked ? 'مقفل' : 'مفتوح'}`
  ].filter(Boolean).join('\n');

  navigator.clipboard.writeText(text).then(() => {
    Toast.show('✅ تم نسخ بيانات الطالب', 'success', 2000);
  }).catch(() => {
    Toast.show('❌ فشل النسخ', 'error');
  });
}

// ===== Reload =====
async function reloadStudent() {
  const id = student?.id;
  if (!id) return;

  // إعادة تحميل بيانات الطالب فقط + الحقول + الطلبات
  const [{ data: s }, { data: r }, { data: er }] = await Promise.all([
    SB.from('students').select('*').eq('id', id).single(),
    SB.from('student_dynamic_responses').select('field_id,value').eq('student_id', id),
    SB.from('edit_requests').select('*').eq('student_id', id).order('requested_at', { ascending: false })
  ]);

  if (s) student = s;
  responses = {};
  (r || []).forEach(x => { responses[x.field_id] = x.value; });
  editRequests = er || [];

  render();
}
</script>
