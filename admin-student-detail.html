<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الحقول الديناميكية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<style>
.admin-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-bottom:15px;border-bottom:2px solid #eee;margin-bottom:20px}
.btn{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block;font-weight:600}
.btn-gray{background:#6c757d;color:#fff}.btn-red{background:#dc3545;color:#fff}
.btn-green{background:#28a745;color:#fff}.btn-blue{background:#1e3c72;color:#fff}
.btn-yellow{background:#ffc107;color:#333}
.btn-sm{padding:5px 12px;font-size:12px}
.field-form{display:none;background:#f8f9fa;padding:22px;border-radius:12px;margin:20px 0}
.field-form.show{display:block}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-row .full{grid-column:1/-1}
.form-group label{display:block;font-weight:600;font-size:13px;margin-bottom:6px;color:#333}
.form-control{width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit}
.form-control:focus{outline:none;border-color:#1e3c72}
.cb-group{display:flex;gap:20px;flex-wrap:wrap;padding:10px 0}
.cb-group label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:normal;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:15px}
th{background:#1e3c72;color:#fff;padding:12px;text-align:right}
td{padding:10px;border-bottom:1px solid #eee}
tr:hover{background:#f8f9fa}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container" style="max-width:1000px;">
<div class="card">
  <div class="admin-header">
    <h1 style="margin:0;font-size:22px;">📝 إدارة الحقول الديناميكية</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a href="admin-import-export.html" class="btn btn-blue">📥 استيراد من Excel</a>
      <a href="admin-dashboard.html" class="btn btn-gray">📊 لوحة التحكم</a>
      <button class="btn btn-red" onclick="Auth.adminLogout()">🚪 خروج</button>
    </div>
  </div>

  <button class="btn btn-green" onclick="toggleForm()" id="addBtn">➕ إضافة حقل جديد</button>

  <div class="field-form" id="formWrap">
    <h3 style="margin:0 0 15px;color:#1e3c72;" id="formTitle">➕ إضافة حقل جديد</h3>
    <form id="f" onsubmit="save(event)">
      <div class="form-row">
        <div class="form-group"><label>اسم الحقل *</label><input type="text" id="name" class="form-control" required></div>
        <div class="form-group"><label>المفتاح (إنجليزي) *</label><input type="text" id="key" class="form-control" required dir="ltr" placeholder="field_key"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>النوع</label>
          <select id="type" class="form-control" onchange="toggleOptions()">
            <option value="text">نص</option>
            <option value="select">قائمة منسدلة</option>
          </select>
        </div>
        <div class="form-group"><label>الترتيب</label><input type="number" id="order" class="form-control" value="0" min="0"></div>
      </div>
      <div class="form-group" id="optionsGroup" style="display:none;">
        <label>الخيارات (مفصولة بفاصلة)</label>
        <input type="text" id="options" class="form-control" placeholder="خيار 1, خيار 2">
      </div>
      <div class="cb-group">
        <label><input type="checkbox" id="required"> مطلوب</label>
        <label><input type="checkbox" id="readonly"> للقراءة فقط</label>
        <label><input type="checkbox" id="visible" checked> ظاهر للطالب</label>
      </div>
      <div style="margin-top:10px;display:flex;gap:10px;">
        <button type="submit" class="btn btn-blue">💾 حفظ</button>
        <button type="button" class="btn btn-gray" onclick="cancelForm()">إلغاء</button>
      </div>
    </form>
  </div>

  <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>#</th><th>الاسم</th><th>المفتاح</th><th>النوع</th><th>مطلوب</th><th>ظاهر</th><th>الإجراءات</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="7" style="text-align:center;padding:30px;color:#999;">⏳...</td></tr></tbody>
    </table>
  </div>
</div>
</div>

<script src="lib/supabase.js"></script>
<script src="lib/auth.js"></script>
<script src="lib/toast.js"></script>
<script src="lib/escape.js"></script>
<script>
let items = [], editingId = null, auth0 = null;

(async () => {
  auth0 = await Auth.requireAdmin();
  if (!auth0) return;
  load();
})();

function toggleOptions() {
  document.getElementById('optionsGroup').style.display = document.getElementById('type').value === 'select' ? 'block' : 'none';
}
function toggleForm() {
  const w = document.getElementById('formWrap');
  w.classList.toggle('show');
  if (!w.classList.contains('show')) cancelForm();
}
function cancelForm() {
  document.getElementById('f').reset();
  document.getElementById('formWrap').classList.remove('show');
  document.getElementById('formTitle').textContent = '➕ إضافة حقل جديد';
  editingId = null;
}

async function load() {
  const { data, error } = await SB.from('dynamic_fields').select('*').order('display_order').order('created_at');
  if (error) { Toast.show('خطأ: ' + error.message, 'error'); return; }
  items = data || [];
  render();
}

function render() {
  const tb = document.getElementById('tbody');
  if (items.length === 0) { tb.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:#999;">📭 لا توجد حقول</td></tr>'; return; }
  tb.innerHTML = items.map((f,i) => `
    <tr>
      <td>${i+1}</td>
      <td><strong>${esc(f.name)}</strong></td>
      <td dir="ltr">${esc(f.field_key)}</td>
      <td>${f.type==='text'?'نص':'قائمة'}</td>
      <td>${f.is_required?'✅':'❌'}</td>
      <td>${f.visible_for_student?'✅':'❌'}</td>
      <td>
        <button class="btn btn-sm btn-yellow" onclick="edit('${f.id}')">✏️</button>
        <button class="btn btn-sm btn-red" onclick="del('${f.id}')">🗑️</button>
      </td>
    </tr>`).join('');
}

function edit(id) {
  const f = items.find(x => x.id === id);
  if (!f) return;
  editingId = id;
  document.getElementById('name').value = f.name;
  document.getElementById('key').value = f.field_key;
  document.getElementById('type').value = f.type;
  document.getElementById('order').value = f.display_order || 0;
  document.getElementById('options').value = (f.options || []).join(', ');
  document.getElementById('required').checked = !!f.is_required;
  document.getElementById('readonly').checked = !!f.is_readonly;
  document.getElementById('visible').checked = !!f.visible_for_student;
  document.getElementById('formTitle').textContent = '✏️ تعديل حقل';
  document.getElementById('formWrap').classList.add('show');
  toggleOptions();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

async function save(e) {
  e.preventDefault();
  const data = {
    name: document.getElementById('name').value.trim(),
    field_key: document.getElementById('key').value.trim(),
    type: document.getElementById('type').value,
    display_order: parseInt(document.getElementById('order').value) || 0,
    options: document.getElementById('type').value === 'select'
      ? document.getElementById('options').value.split(',').map(o => o.trim()).filter(Boolean)
      : null,
    is_required: document.getElementById('required').checked,
    is_readonly: document.getElementById('readonly').checked,
    visible_for_student: document.getElementById('visible').checked
  };
  if (!data.name || !data.field_key) return Toast.show('املأ الحقول المطلوبة', 'warn');

  const { error } = editingId
    ? await SB.from('dynamic_fields').update(data).eq('id', editingId)
    : await SB.from('dynamic_fields').insert(data);
  if (error) return Toast.show('خطأ: ' + error.message, 'error');

  await SB.from('admin_logs').insert({
    admin_id: auth0.user.id, admin_email: auth0.user.email,
    action: editingId ? 'تعديل حقل' : 'إضافة حقل', details: data.name
  });
  Toast.show('✅ تم الحفظ');
  cancelForm();
  load();
}

async function del(id) {
  const f = items.find(x => x.id === id);
  if (!confirm(`حذف الحقل "${f.name}"؟ سيتم حذف كل الاستجابات المرتبطة به.`)) return;
  const { error } = await SB.from('dynamic_fields').delete().eq('id', id);
  if (error) return Toast.show('خطأ: ' + error.message, 'error');
  await SB.from('admin_logs').insert({
    admin_id: auth0.user.id, admin_email: auth0.user.email,
    action: 'حذف حقل', details: f.name
  });
  Toast.show('✅ تم الحذف');
  load();
}
</script>
</body>
</html>
