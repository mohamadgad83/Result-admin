<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة الطلاب</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<style>
.admin-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-bottom:15px;border-bottom:2px solid #eee;margin-bottom:20px}
.btn-back{padding:10px 18px;background:#6c757d;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block}
.btn-logout{padding:10px 18px;background:#dc3545;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px}
.search-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.search-bar input,.search-bar select{padding:10px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;min-width:150px;flex:1;font-family:inherit}
.search-bar input:focus,.search-bar select:focus{outline:none;border-color:#1e3c72}
.stats-mini{display:flex;gap:20px;flex-wrap:wrap;padding:14px;background:#f8f9fa;border-radius:12px;margin-bottom:15px;font-size:14px}
.stats-mini strong{color:#1e3c72;font-size:18px}
.bulk-bar{display:flex;gap:10px;flex-wrap:wrap;padding:14px;background:#f8f9fa;border-radius:12px;margin-bottom:15px;align-items:center}
.bulk-bar .btn{padding:8px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.btn-unlock{background:#28a745;color:#fff}.btn-unlock:hover{background:#1e7e34}
.btn-lock{background:#dc3545;color:#fff}.btn-lock:hover{background:#a71d2a}
.btn-export{background:#17a2b8;color:#fff}.btn-export:hover{background:#138496}
.btn-select{background:#6c757d;color:#fff}.btn-select:hover{background:#5a6268}
.table-wrap{overflow-x:auto;margin:15px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#1e3c72;color:#fff;padding:10px;text-align:center;white-space:nowrap}
td{padding:8px;border-bottom:1px solid #eee;text-align:center;vertical-align:middle}
tr:hover{background:#f8f9fa}
tr.selected{background:#e7f5ea}
.row-cb{width:16px;height:16px;cursor:pointer;accent-color:#1e3c72}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge.locked{background:#d4edda;color:#155724}
.badge.unlocked{background:#fff3cd;color:#856404}
.act{padding:4px 8px;text-decoration:none;font-size:14px;margin:0 2px;border-radius:4px}
.act:hover{background:#eef}
.pagination{display:flex;gap:8px;justify-content:center;margin:15px 0;flex-wrap:wrap}
.pagination button{padding:6px 12px;background:#fff;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.pagination button.active{background:#1e3c72;color:#fff;border-color:#1e3c72}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div class="container" style="max-width:1200px;">
<div class="card">
  <div class="admin-header">
    <h1 style="margin:0;font-size:22px;">👨‍🎓 إدارة الطلاب</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a href="admin-import-export.html" class="btn-back" style="background:#17a2b8;">📥 استيراد</a>
      <a href="admin-dashboard.html" class="btn-back">📊 لوحة التحكم</a>
      <button class="btn-logout" onclick="Auth.adminLogout()">🚪 خروج</button>
    </div>
  </div>

  <div class="stats-mini">
    <span>📊 الإجمالي: <strong id="totalCount">0</strong></span>
    <span>🔒 مقفل: <strong id="lockedCount">0</strong></span>
    <span>🔓 مفتوح: <strong id="unlockedCount">0</strong></span>
    <span>✅ المحدد: <strong id="selectedCount">0</strong></span>
  </div>

  <div class="search-bar">
    <input type="text" id="q" placeholder="🔍 بحث بالاسم/الكود/الرقم القومي" oninput="debouncedLoad()">
    <select id="filterStream" onchange="loadStudents()">
      <option value="">كل التشعيبات</option><option value="ثانوي">ثانوي</option><option value="بكالوريا">بكالوريا</option>
    </select>
    <select id="filterStatus" onchange="loadStudents()">
      <option value="">كل الحالات</option><option value="locked">🔒 مقفل</option><option value="unlocked">🔓 مفتوح</option>
    </select>
    <button class="btn-back" onclick="resetFilters()">مسح</button>
  </div>

  <div class="bulk-bar">
    <span>✅ المحدد: <strong id="selDisplay">0</strong></span>
    <button class="btn btn-select" onclick="selectAll()">✔️ تحديد الكل</button>
    <button class="btn btn-select" onclick="deselectAll()">✖️ إلغاء الكل</button>
    <button class="btn btn-unlock" onclick="bulkUnlock()">🔓 فتح</button>
    <button class="btn btn-lock" onclick="bulkLock()">🔒 قفل</button>
    <button class="btn btn-export" onclick="exportSelected()">📥 تصدير Excel</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th style="width:36px;"><input type="checkbox" class="row-cb" id="selectAllCb" onchange="toggleAll()"></th>
        <th>#</th><th>الاسم</th><th>الكود</th><th>الرقم القومي</th><th>الصف</th><th>حالة القيد</th><th>التشعيب</th><th>الحالة</th><th>الإجراءات</th>
      </tr></thead>
      <tbody id="tbody"><tr><td colspan="10" style="padding:30px;text-align:center;color:#999;">⏳ جاري التحميل...</td></tr></tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>
</div>
</div>

<script src="lib/supabase.js"></script>
<script src="lib/auth.js"></script>
<script src="lib/toast.js"></script>
<script src="lib/escape.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script>
const PAGE_SIZE = 50;
let currentPage = 1;
let totalPages = 1;
let allStudents = [];
let selected = new Set();
let auth0 = null;

(async () => {
  auth0 = await Auth.requireAdmin();
  if (!auth0) return;
  loadStudents();
})();

let debounceTimer;
function debouncedLoad() { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => { currentPage = 1; loadStudents(); }, 400); }

function buildQuery() {
  let q = SB.from('students').select('*', { count: 'exact' });
  const search = document.getElementById('q').value.trim();
  if (search) q = q.or(`full_name.ilike.%${search}%,student_code.ilike.%${search}%,national_id.ilike.%${search}%`);
  const stream = document.getElementById('filterStream').value;
  if (stream) q = q.eq('stream', stream);
  const status = document.getElementById('filterStatus').value;
  if (status === 'locked') q = q.eq('is_locked', true);
  else if (status === 'unlocked') q = q.or('is_locked.is.null,is_locked.eq.false');
  return q;
}

async function loadStudents() {
  const from = (currentPage - 1) * PAGE_SIZE;
  const to = from + PAGE_SIZE - 1;
  const { data, error, count } = await buildQuery()
    .order('created_at', { ascending: false }).range(from, to);
  if (error) { Toast.show('خطأ: ' + error.message, 'error'); return; }
  allStudents = data || [];
  totalPages = Math.max(1, Math.ceil((count || 0) / PAGE_SIZE));
  render();
  updateStats(count || 0);
  renderPagination();
  document.getElementById('totalCount').textContent = count || 0;
}

async function updateStats(total) {
  const [{count:locked},{count:unlocked}] = await Promise.all([
    SB.from('students').select('*',{count:'exact',head:true}).eq('is_locked',true),
    SB.from('students').select('*',{count:'exact',head:true}).or('is_locked.is.null,is_locked.eq.false')
  ]);
  document.getElementById('lockedCount').textContent = locked || 0;
  document.getElementById('unlockedCount').textContent = unlocked || 0;
}

function render() {
  const tb = document.getElementById('tbody');
  if (allStudents.length === 0) {
    tb.innerHTML = '<tr><td colspan="8" style="padding:30px;text-align:center;color:#999;">📭 لا يوجد طلاب</td></tr>';
    return;
  }
  tb.innerHTML = allStudents.map((s, i) => {
    const locked = !!s.is_locked;
    const isSel = selected.has(s.id);
    const idx = (currentPage - 1) * PAGE_SIZE + i + 1;
    const masked = s.national_id ? ('****' + String(s.national_id).slice(-4)) : '-';
    return `<tr class="${isSel?'selected':''}">
      <td><input type="checkbox" class="row-cb" data-id="${s.id}" ${isSel?'checked':''} onchange="toggleOne('${s.id}')"></td>
      <td>${idx}</td>
      <td><strong>${esc(s.full_name)}</strong></td>
      <td dir="ltr">${esc(s.student_code)}</td>
      <td dir="ltr">${esc(masked)}</td>
      <td>${esc(s.grade || '-')}</td>
      <td>${esc(s.enrollment_status || '-')}</td>
      <td>${esc(s.stream||'-')}</td>
      <td><span class="badge ${locked?'locked':'unlocked'}">${locked?'🔒 مقفل':'🔓 مفتوح'}</span></td>
      <td>
        <a href="admin-student-detail.html?id=${s.id}" class="act" title="عرض">👁️</a>
        <a href="#" class="act" onclick="toggleLock('${s.id}');return false;" title="${locked?'فتح':'قفل'}">${locked?'🔓':'🔒'}</a>
        <a href="student-pdf.html?print=${s.id}" target="_blank" class="act" title="PDF">📄</a>
      </td>
    </tr>`;
  }).join('');
}

function renderPagination() {
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  let html = `<button ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">‹ السابق</button>`;
  const start = Math.max(1, currentPage - 2);
  const end = Math.min(totalPages, currentPage + 2);
  if (start > 1) html += `<button onclick="goPage(1)">1</button>${start>2?'...':''}`;
  for (let p = start; p <= end; p++) {
    html += `<button class="${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
  }
  if (end < totalPages) html += `${end<totalPages-1?'...':''}<button onclick="goPage(${totalPages})">${totalPages}</button>`;
  html += `<button ${currentPage===totalPages?'disabled':''} onclick="goPage(${currentPage+1})">التالي ›</button>`;
  el.innerHTML = html;
}

function goPage(p) { if (p<1||p>totalPages) return; currentPage = p; loadStudents(); }
function toggleOne(id) { selected.has(id) ? selected.delete(id) : selected.add(id); updateSel(); render(); }
function toggleAll() { const c = document.getElementById('selectAllCb').checked; if (c) allStudents.forEach(s => selected.add(s.id)); else allStudents.forEach(s => selected.delete(s.id)); updateSel(); render(); }
function selectAll() { allStudents.forEach(s => selected.add(s.id)); document.getElementById('selectAllCb').checked = true; updateSel(); render(); }
function deselectAll() { selected.clear(); document.getElementById('selectAllCb').checked = false; updateSel(); render(); }
function updateSel() { document.getElementById('selDisplay').textContent = selected.size; document.getElementById('selectedCount').textContent = selected.size; }

async function toggleLock(id) {
  const s = allStudents.find(x => x.id === id);
  if (!s) return;
  const newLock = !s.is_locked;
  if (!confirm(newLock ? 'قفل هذا الطالب؟' : 'فتح هذا الطالب للتعديل؟')) return;
  const { error } = await SB.from('students').update({
    is_locked: newLock, submitted_at: newLock ? s.submitted_at : null
  }).eq('id', id);
  if (error) { Toast.show('خطأ: ' + error.message, 'error'); return; }
  await logAction(newLock ? 'قفل طالب' : 'فتح طالب', `${newLock?'قفل':'فتح'} الطالب ${s.full_name}`, id, s.full_name);
  Toast.show(newLock ? '✅ تم القفل' : '✅ تم الفتح');
  loadStudents();
}

async function bulkLock() { await bulkUpdate(true); }
async function bulkUnlock() { await bulkUpdate(false); }
async function bulkUpdate(lock) {
  if (selected.size === 0) return Toast.show('اختر طالباً على الأقل', 'warn');
  const action = lock ? 'قفل' : 'فتح';
  if (!confirm(`${action} ${selected.size} طالب؟`)) return;
  const ids = Array.from(selected);
  const update = { is_locked: lock };
  if (!lock) update.submitted_at = null;
  const { error } = await SB.from('students').update(update).in('id', ids);
  if (error) return Toast.show('خطأ: ' + error.message, 'error');
  await logAction(`${action} جماعي`, `${action} ${ids.length} طالب`);
  Toast.show(`✅ تم ${action} ${ids.length} طالب`);
  selected.clear(); updateSel();
  loadStudents();
}

async function exportSelected() {
  const list = selected.size > 0 ? allStudents.filter(s => selected.has(s.id)) : allStudents;
  if (list.length === 0) return Toast.show('لا بيانات', 'warn');
  const { data: fields } = await SB.from('dynamic_fields').select('id,name').eq('visible_for_student', true);
  const ids = list.map(s => s.id);
  const { data: resp } = await SB.from('student_dynamic_responses').select('student_id,field_id,value').in('student_id', ids);
  const rmap = {};
  (resp||[]).forEach(r => { (rmap[r.student_id] ??= {})[r.field_id] = r.value; });
  const headers = ['#','الاسم','الكود','الرقم القومي','التشعيب','التخصص','المسار','المادة الاختيارية','الحالة','تاريخ التقديم',...(fields||[]).map(f=>f.name)];
  const rows = list.map((s,i) => [
    i+1, s.full_name, s.student_code, s.national_id, s.stream||'', s.specialization||'', s.track||'', s.optional_subject||'',
    s.is_locked?'مقفل':'مفتوح', s.submitted_at?new Date(s.submitted_at).toLocaleString('ar-EG'):'',
    ...(fields||[]).map(f => rmap[s.id]?.[f.id] || '')
  ]);
  Excel.download([headers, ...rows], `طلاب_${new Date().toISOString().slice(0,10)}.xlsx`, 'طلاب');
  await logAction('تصدير', `${list.length} طالب`);
}

async function logAction(action, details, studentId = null, studentName = null) {
  await SB.from('admin_logs').insert({
    admin_id: auth0.user.id, admin_email: auth0.user.email,
    action, details, student_id: studentId, student_name: studentName
  });
}

function resetFilters() {
  document.getElementById('q').value = '';
  document.getElementById('filterStream').value = '';
  document.getElementById('filterStatus').value = '';
  currentPage = 1;
  loadStudents();
}
</script>
</body>
</html>
