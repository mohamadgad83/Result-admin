<body>
<div class="container">
  <div class="card login-card">
    <div class="text-center">
      <div class="logo">👑</div>
      <h1>لوحة التحكم</h1>
      <p class="subtitle">مدرسة دشنا الثانوية</p>
    </div>
    <form id="loginForm" class="form">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" class="form-control" required dir="ltr">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" class="form-control" required dir="ltr">
      </div>
      <div id="errorMsg" class="error-msg" style="display:none;"></div>
      <button type="submit" class="btn-primary" id="btn">🚪 دخول</button>
    </form>
    <div class="text-center mt-3"><a href="index.html" class="link">العودة للصفحة الرئيسية</a></div>
  </div>
</div>
<script src="lib/supabase.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('errorMsg');
  const btn = document.getElementById('btn');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'جاري التحقق...';

  const { data, error } = await SB.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  });
  if (error || !data.user) {
    err.textContent = 'البريد أو كلمة المرور غير صحيحة';
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = '🚪 دخول';
    return;
  }
  const { data: admin } = await SB.from('admins').select('id').eq('id', data.user.id).maybeSingle();
  if (!admin) {
    await SB.auth.signOut();
    err.textContent = 'ليس لديك صلاحية الدخول كأدمن';
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = '🚪 دخول';
    return;
  }
  location.href = 'admin-dashboard.html';
});
</script>
</body>
