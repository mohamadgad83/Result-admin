<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استيراد/تصدير</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .import-export-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin: 20px 0;
        }
        .action-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 16px;
            border: 2px solid #e9ecef;
        }
        .action-card h3 {
            color: #1e3c72;
            margin-bottom: 10px;
        }
        .action-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .file-input {
            width: 100%;
            padding: 15px;
            border: 2px dashed #ccc;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px 0;
        }
        .file-input:hover {
            border-color: #1e3c72;
            background: #f0f7ff;
        }
        .results-box {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e9ecef;
        }
        .results-box .success { color: #28a745; }
        .results-box .error { color: #dc3545; }
        .results-box .total { color: #1e3c72; }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
            margin-bottom: 20px;
        }
        .btn-back {
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-back:hover { background: #5a6268; }
        .btn-export {
            padding: 12px 30px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
        }
        .btn-export:hover { background: #0f2b4f; }
        .btn-import {
            padding: 12px 30px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }
        .btn-import:hover { background: #1e7e34; }
        .btn-import:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .results-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        .results-stats div {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
        }
        .results-stats .success-count { background: #d4edda; color: #155724; }
        .results-stats .error-count { background: #f8d7da; color: #721c24; }
        .results-stats .total-count { background: #cce5ff; color: #004085; }
        .errors-list {
            max-height: 150px;
            overflow-y: auto;
            font-size: 13px;
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .errors-list li {
            padding: 3px 0;
            color: #dc3545;
        }
        @media (max-width: 600px) {
            .import-export-grid { grid-template-columns: 1fr; }
            .results-stats { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container" style="max-width:900px;">
        <div class="card">
            <!-- Header -->
            <div class="admin-header">
                <div>
                    <h1 style="margin:0;">📤 استيراد/تصدير الطلاب</h1>
                </div>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <a href="admin-dashboard.html" class="btn-back">📊 لوحة التحكم</a>
                    <button onclick="logout()" style="padding:10px 20px;background:#dc3545;color:white;border:none;border-radius:8px;cursor:pointer;">🚪 خروج</button>
                </div>
            </div>

            <div class="import-export-grid">
                <!-- تصدير -->
                <div class="action-card">
                    <h3>📥 تصدير البيانات</h3>
                    <p>تصدير جميع بيانات الطلاب إلى ملف Excel شامل</p>
                    <button onclick="exportData()" class="btn-export">📥 تحميل ملف Excel</button>
                </div>

                <!-- استيراد -->
                <div class="action-card">
                    <h3>📤 استيراد طلاب</h3>
                    <p>استيراد طلاب من ملف Excel (يجب أن يحتوي على: الكود، الرقم القومي، الاسم، التشعيب)</p>
                    <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls,.csv">
                    <button onclick="importData()" class="btn-import" id="importBtn">📊 استيراد البيانات</button>
                    <div id="importResult"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        // التحقق من وجود أدمن
        if (!sessionStorage.getItem('adminId')) {
            window.location.href = 'admin-login.html'
        }

        // تصدير البيانات
        async function exportData() {
            try {
                // جلب جميع الطلاب
                const { data: students, error } = await supabase
                    .from('students')
                    .select('*')
                    .order('created_at', { ascending: false })

                if (error) throw error

                // جلب الحقول الديناميكية
                const { data: fields, error: fieldsError } = await supabase
                    .from('dynamic_fields')
                    .select('id, name')
                    .eq('visible_for_student', true)

                if (fieldsError) throw fieldsError

                // جلب الاستجابات
                const studentIds = students.map(s => s.id)
                const { data: responses, error: responsesError } = await supabase
                    .from('student_dynamic_responses')
                    .select('student_id, field_id, value')
                    .in('student_id', studentIds)

                if (responsesError) throw responsesError

                // تحويل البيانات
                const exportData = students.map(student => {
                    const row = {
                        'الكود': student.student_code,
                        'الرقم القومي': student.national_id,
                        'الاسم': student.full_name,
                        'التشعيب': student.stream || '',
                        'التخصص/المسار': student.specialization || student.track || '',
                        'المادة الاختيارية': student.optional_subject || '',
                        'الحالة': student.is_locked ? 'مقفل' : 'مفتوح',
                        'تاريخ التقديم': student.submitted_at ? new Date(student.submitted_at).toLocaleDateString('ar-EG') : '',
                    }

                    // إضافة الحقول الديناميكية
                    fields.forEach(field => {
                        const response = responses?.find(
                            r => r.student_id === student.id && r.field_id === field.id
                        )
                        row[field.name] = response?.value || ''
                    })

                    return row
                })

                // إنشاء ملف Excel
                const wb = XLSX.utils.book_new()
                const ws = XLSX.utils.json_to_sheet(exportData)
                XLSX.utils.book_append_sheet(wb, ws, 'الطلاب')
                
                // تحميل الملف
                XLSX.writeFile(wb, `طلاب_مدرسة_دشنا_${new Date().toISOString().split('T')[0]}.xlsx`)
                
            } catch (err) {
                console.error('Error exporting:', err)
                alert('حدث خطأ أثناء التصدير')
            }
        }

        // استيراد البيانات
        async function importData() {
            const fileInput = document.getElementById('fileInput')
            const file = fileInput.files[0]
            const resultDiv = document.getElementById('importResult')
            const importBtn = document.getElementById('importBtn')

            if (!file) {
                resultDiv.innerHTML = '<div class="error" style="color:#dc3545;margin-top:10px;">⚠️ يرجى اختيار ملف أولاً</div>'
                return
            }

            importBtn.disabled = true
            importBtn.textContent = '⏳ جاري الاستيراد...'
            resultDiv.innerHTML = ''

            try {
                // قراءة الملف
                const data = await file.arrayBuffer()
                const workbook = XLSX.read(data)
                const worksheet = workbook.Sheets[workbook.SheetNames[0]]
                const rows = XLSX.utils.sheet_to_json(worksheet)

                let successCount = 0
                let errorCount = 0
                const errors = []

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i]
                    const rowNum = i + 2

                    try {
                        // التحقق من الحقول المطلوبة
                        if (!row['الكود'] || !row['الرقم القومي'] || !row['الاسم'] || !row['التشعيب']) {
                            errorCount++
                            errors.push(`صف ${rowNum}: الحقول المطلوبة غير مكتملة`)
                            continue
                        }

                        // التحقق من عدم التكرار
                        const { data: existing, error: checkError } = await supabase
                            .from('students')
                            .select('id')
                            .or(`student_code.eq.${row['الكود']},national_id.eq.${row['الرقم القومي']}`)
                            .maybeSingle()

                        if (checkError) {
                            errorCount++
                            errors.push(`صف ${rowNum}: خطأ في التحقق`)
                            continue
                        }

                        if (existing) {
                            errorCount++
                            errors.push(`صف ${rowNum}: الكود أو الرقم القومي موجود مسبقاً`)
                            continue
                        }

                        // إضافة الطالب
                        const studentData = {
                            student_code: String(row['الكود']),
                            national_id: String(row['الرقم القومي']),
                            full_name: String(row['الاسم']),
                            stream: row['التشعيب'],
                            is_locked: true,
                        }

                        if (row['التشعيب'] === 'ثانوي') {
                            studentData.specialization = row['التخصص/المسار'] || null
                        } else if (row['التشعيب'] === 'بكالوريا') {
                            studentData.track = row['التخصص/المسار'] || null
                            studentData.optional_subject = row['المادة الاختيارية'] || null
                        }

                        const { error: insertError } = await supabase
                            .from('students')
                            .insert(studentData)

                        if (insertError) {
                            errorCount++
                            errors.push(`صف ${rowNum}: ${insertError.message}`)
                            continue
                        }

                        successCount++
                    } catch (err) {
                        errorCount++
                        errors.push(`صف ${rowNum}: خطأ غير متوقع`)
                    }
                }

                // عرض النتائج
                let resultHtml = `
                    <div class="results-box">
                        <div class="results-stats">
                            <div class="success-count">✅ ${successCount} تمت الإضافة</div>
                            <div class="error-count">❌ ${errorCount} فشل</div>
                            <div class="total-count">📊 ${rows.length} إجمالي</div>
                        </div>
                `

                if (errors.length > 0) {
                    resultHtml += `
                        <div class="errors-list">
                            <strong>الأخطاء:</strong>
                            <ul>${errors.map(e => `<li>${e}</li>`).join('')}</ul>
                        </div>
                    `
                }

                resultHtml += '</div>'
                resultDiv.innerHTML = resultHtml

            } catch (err) {
                console.error('Error importing:', err)
                resultDiv.innerHTML = `<div class="error" style="color:#dc3545;margin-top:10px;">❌ حدث خطأ أثناء الاستيراد: ${err.message}</div>`
            } finally {
                importBtn.disabled = false
                importBtn.textContent = '📊 استيراد البيانات'
                document.getElementById('fileInput').value = ''
            }
        }

        function logout() {
            sessionStorage.clear()
            window.location.href = 'admin-login.html'
        }
    </script>
</body>
</html>
