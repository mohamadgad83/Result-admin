<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استيراد/تصدير Excel - مدرسة دشنا الثانوية</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
<style>
.admin-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-bottom:15px;border-bottom:2px solid #eee;margin-bottom:20px}
.btn{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block;font-weight:600;transition:all .2s}
.btn:hover{transform:translateY(-1px)}
.btn-gray{background:#6c757d;color:#fff}
.btn-red{background:#dc3545;color:#fff}
.btn-green{background:#28a745;color:#fff}
.btn-blue{background:#17a2b8;color:#fff}
.btn-purple{background:#6f42c1;color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;border-bottom:2px solid #eee;padding-bottom:0}
.tab{padding:12px 22px;border-radius:10px 10px 0 0;cursor:pointer;background:transparent;border:none;border-bottom:3px solid transparent;font-weight:700;font-size:14px;font-family:inherit;color:#666;margin-bottom:-2px;transition:all .2s}
.tab.active{background:#fff;color:#1e3c72;border-bottom-color:#1e3c72}
.tab:hover:not(.active){color:#1e3c72;background:#f8f9fa}
.panel{background:#f8f9fa;padding:22px;border-radius:14px;margin:15px 0;border:1px solid #e9ecef}
.panel h3{margin:0 0 15px;color:#1e3c72;font-size:16px}
.info-box{background:#fff8e1;padding:14px;border-radius:10px;margin:10px 0;font-size:13px;border-right:4px solid #ffc107;color:#856404;line-height:1.8}
.info-box.green{background:#e8f5e9;border-right-color:#28a745;color:#2e7d32}
.upload-area{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:20px;background:#fff;border:2px dashed #ccc;border-radius:12px;transition:border-color .2s}
.upload-area:hover{border-color:#1e3c72}
.upload-area input[type=file]{flex:1;min-width:200px;padding:10px;border:1px solid #ddd;border-radius:8px;background:#fafafa;font-family:inherit}
.btn-template{background:#17a2b8;color:#fff;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;transition:all .2s}
.btn-template:hover{background:#138496}
.btn-import{background:#28a745;color:#fff;padding:12px 30px;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:15px;transition:all .2s}
.btn-import:hover{background:#1e7e34}
.btn-import:disabled{opacity:.5;cursor:not-allowed;transform:none}
.preview{background:#fff;border-radius:10px;padding:15px;margin-top:15px;overflow-x:auto;max-height:300px;border:1px solid #e9ecef}
.preview table{width:100%;border-collapse:collapse;font-size:12px}
.preview th{background:#1e3c72;color:#fff;padding:10px;text-align:right;position:sticky;top:0;font-weight:600}
.preview td{padding:8px 10px;border-bottom:1px solid #eee}
.preview td.ltr-cell{direction:ltr;unicode-bidi:isolate;font-family:'Courier New',monospace;text-align:left}
.result{margin-top:15px;padding:16px;border-radius:12px;display:none}
.result.show{display:block;animation:fadeIn .3s ease}
.result.success{background:#d4edda;color:#155724;border:1px solid #28a745}
.result.error{background:#f8d7da;color:#721c24;border:1px solid #dc3545}
.result.partial{background:#fff3cd;color:#856404;border:1px solid #ffc107}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.stat-box{text-align:center;padding:12px;background:#fff;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.05)}
.stat-box .num{font-size:22px;font-weight:700}
.stat-box .lbl{font-size:11px;color:#666;margin-top:4px}
.progress{height:8px;background:#e9ecef;border-radius:4px;margin:10px 0;overflow:hidden;display:none}
.progress.show{display:block}
.progress-bar{height:100%;background:#28a745;width:0;transition:width .3s}
.mode-row{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0;padding:12px;background:#fff;border-radius:10px;font-size:14px;border:1px solid #e9ecef}
.mode-row label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;color:#333}
.mode-row input[type=radio]{width:16px;height:16px;cursor:pointer}

/* منتقي الحقول */
.column-picker{margin:15px 0;padding:18px;background:#fff;border:2px solid #1e3c72;border-radius:12px}
.column-picker .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.column-picker .head h4{margin:0;color:#1e3c72;font-size:16px}
.column-picker .head .actions{display:flex;gap:6px}
.column-picker .head button{padding:6px 14px;font-size:12px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.column-picker .hint{font-size:12px;color:#666;margin:0 0 12px;padding:10px;background:#e3f2fd;border-radius:8px;border-right:3px solid #17a2b8}
.column-picker .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.column-pick{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f8f9fa;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;transition:all .15s}
.column-pick:hover{border-color:#1e3c72;background:#eef2f7}
.column-pick.selected{background:#e8f5e9;border-color:#28a745}
.column-pick input{width:18px;height:18px;cursor:pointer;accent-color:#28a745;flex-shrink:0}
.column-pick .info{flex:1;min-width:0}
.column-pick .name{font-weight:600;font-size:13px;color:#333}
.column-pick .name .req-star{color:#dc3545;margin-right:3px}
.column-pick .sample{font-size:11px;color:#999;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;unicode-bidi:isolate;text-align:left;font-family:'Courier New',monospace}
.column-pick .required-badge{font-size:9px;background:#1e3c72;color:#fff;padding:1px 6px;border-radius:8px;margin-right:4px}
.column-pick .type-badge{font-size:9px;background:#17a2b8;color:#fff;padding:1px 6px;border-radius:8px;margin-right:4px}

@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="container" style="max-width:1050px;">
<div class="card">
  <div class="admin-header">
    <h1 style="margin:0;font-size:22px;">📥 استيراد/تصدير البيانات</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a href="admin-dashboard.html" class="btn btn-gray">📊 لوحة التحكم</a>
      <button class="btn btn-red" onclick="Auth.adminLogout()">🚪 خروج</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('import')" id="tab-import">📥 استيراد</button>
    <button class="tab" onclick="switchTab('export')" id="tab-export">📤 تصدير</button>
  </div>

  <!-- ===== لوحة الاستيراد ===== -->
  <div id="panel-import">
    <div style="display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;">
      <button class="tab active" onclick="selectSchema('students')" id="schema-students">👨‍🎓 الطلاب</button>
      <button class="tab" onclick="selectSchema('responses')" id="schema-responses">📊 استجابات الطلاب</button>
      <button class="tab" onclick="selectSchema('fields')" id="schema-fields">📝 الحقول</button>
      <button class="tab" onclick="selectSchema('sections')" id="schema-sections">📂 الأقسام</button>
    </div>

    <div class="info-box" id="infoBox"></div>

    <div class="panel">
      <h3>1️⃣ حمّل النموذج (إذا لم يكن لديك)</h3>
      <button class="btn-template" onclick="downloadTemplate()">📋 تحميل النموذج</button>
      <button class="btn-template" onclick="backupStudents()" style="background:#6f42c1;margin-right:8px;">💾 نسخة احتياطية</button>
    </div>

    <div class="panel">
      <h3>2️⃣ ارفع الملف</h3>
      <div class="upload-area">
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
        <button class="btn-import" id="importBtn" onclick="doImport()">📊 استيراد</button>
      </div>
      <div class="mode-row">
        <label><input type="radio" name="mode" value="insert" checked> ➕ إضافة فقط</label>
        <label><input type="radio" name="mode" value="smart-fill"> 💡 تحديث ذكي (لا يمسح)</label>
        <label><input type="radio" name="mode" value="replace"> 🔄 استبدال كامل ⚠️</label>
      </div>
      <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>

      <!-- منتقي الحقول -->
      <div class="column-picker" id="columnPicker" style="display:none;">
        <div class="head">
          <h4 id="pickerTitle">🔧 اختر الحقول</h4>
          <div class="actions">
            <button onclick="toggleAllColumns(true)" style="background:#28a745;color:#fff;">✔️ الكل</button>
            <button onclick="toggleAllColumns(false)" style="background:#6c757d;color:#fff;">✖️ لا شيء</button>
          </div>
        </div>
        <div class="hint" id="pickerHint"></div>
        <div class="grid" id="columnPickerGrid"></div>
      </div>

      <div class="preview" id="preview" style="display:none;"></div>
      <div class="result" id="result"></div>
    </div>
  </div>

  <!-- ===== لوحة التصدير ===== -->
  <div id="panel-export" style="display:none;">
    <div class="panel">
      <h3>📤 تصدير البيانات الحالية</h3>
      <p style="font-size:13px;color:#666;margin:0 0 15px;">تصدير كل البيانات إلى ملف Excel (بدون أي تغيير في القيم)</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-green" style="padding:12px 25px;" onclick="exportData('students')">📥 تصدير الطلاب</button>
        <button class="btn btn-blue" style="padding:12px 25px;" onclick="exportResponses()">📥 تصدير الاستجابات الكاملة</button>
        <button class="btn btn-blue" style="padding:12px 25px;" onclick="exportData('fields')">📥 تصدير الحقول</button>
        <button class="btn btn-blue" style="padding:12px 25px;" onclick="exportData('sections')">📥 تصدير الأقسام</button>
      </div>
    </div>
  </div>
</div>
</div>

<script src="lib/supabase.js"></script>
<script src="lib/auth.js"></script>
<script src="lib/toast.js"></script>
<script src="lib/escape.js"></script>
<script src="lib/excel.js"></script>
<script>
// ==========================================================
// 🔥 الإصلاحات الجوهرية (فقط داخل هذه الصفحة)
// ==========================================================

// 🧼 تنظيف النص من أحرف Bidi/Zero-Width/BOM - بدون تغيير ترتيب الحروف
function sanitizeText(v) {
  if (v === null || v === undefined) return '';
  if (typeof v !== 'string') return String(v);
  return v
    .replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g, '')
    .trim();
}

// 🚀 قراءة Excel مباشرة مع الحفاظ على القيم كما هي (نص)
function readExcelFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {
          type: 'array',
          cellText: false,
          cellDates: false,
          raw: true
        });
        const ws = wb.Sheets[wb.SheetNames[0]];
        // raw: false → كل حاجة ترجع string كما هي مكتوبة (يحافظ على 0 في البداية، الرموز، إلخ)
        const json = XLSX.utils.sheet_to_json(ws, {
          defval: '',
          raw: false,
          cellText: true,
          dateNF: 'yyyy-mm-dd'
        });
        resolve(json);
      } catch (err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

// 💾 تصدير Excel بإجبار كل الخلايا على نوع "text" (يمنع أي تحويل)
function exportExcelFile(headers, rows, filename) {
  const aoa = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(aoa);

  // إجبار كل الخلايا على type 's' = string
  Object.keys(ws).forEach(key => {
    if (key[0] === '!') return;
    const cell = ws[key];
    if (cell && cell.v !== null && cell.v !== undefined) {
      cell.t = 's';
      cell.v = String(cell.v);
      delete cell.f; // شيل أي فورمولا
      delete cell.z; // شيل أي فورمات
    }
  });

  // ضبط عرض الأعمدة
  ws['!cols'] = headers.map((h, i) => {
    let maxLen = String(h || '').length;
    rows.forEach(r => {
      const v = r[i];
      if (v !== null && v !== undefined) {
        const len = String(v).length;
        if (len > maxLen) maxLen = len;
      }
    });
    return { wch: Math.min(Math.max(maxLen + 2, 10), 45) };
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Data');
  XLSX.writeFile(wb, filename, { bookType: 'xlsx', compression: true });
}

// ==========================================================
// تعريف المخططات
// ==========================================================
const SCHEMAS = {
  students: {
    label: 'الطلاب',
    table: 'students',
    match: 'student_code',
    columns: [
      { key: 'student_code', label: 'الكود', aliases: ['كود الطالب','كود','code'], required: true, type: 'text' },
      { key: 'national_id', label: 'الرقم القومي', aliases: ['رقم قومي','nationalid'], required: true, type: 'text' },
      { key: 'full_name', label: 'الاسم', aliases: ['اسم الطالب','name'], required: true, type: 'text' },
      { key: 'grade', label: 'الصف', aliases: ['grade'], type: 'text' },
      { key: 'enrollment_status', label: 'حالة القيد', aliases: ['status','حالة'], type: 'text', default: 'مقيد' },
      { key: 'gender', label: 'النوع', aliases: ['جنس','gender'], type: 'text' },
      { key: 'date_of_birth', label: 'تاريخ الميلاد (YYYY-MM-DD)', aliases: ['تاريخ ميلاد','birthdate','dob'], type: 'text' },
      { key: 'governorate', label: 'المحافظة', aliases: ['محافظة','governorate'], type: 'text' },
      { key: 'stream', label: 'التشعيب', aliases: ['stream'], type: 'text', default: 'ثانوي' },
      { key: 'specialization', label: 'التخصص', aliases: ['specialization'], type: 'text' },
      { key: 'track', label: 'المسار', aliases: ['track'], type: 'text' },
      { key: 'optional_subject', label: 'المادة الاختيارية', aliases: ['المادة','optional'], type: 'text' }
    ]
  },
  responses: {
    label: 'استجابات الطلاب',
    table: 'student_dynamic_responses',
    match: null,
    columns: []
  },
  fields: {
    label: 'الحقول الديناميكية',
    table: 'dynamic_fields',
    match: 'field_key',
    columns: [
      { key: 'name', label: 'الاسم', aliases: ['اسم الحقل','name'], required: true, type: 'text' },
      { key: 'field_key', label: 'المفتاح', aliases: ['key','field_key'], required: true, type: 'text' },
      { key: 'type', label: 'النوع (text/select)', aliases: ['النوع','type'], required: true, type: 'text', default: 'text' },
      { key: 'section_name', label: 'اسم القسم', aliases: ['القسم','section'], type: 'text' },
      { key: 'options', label: 'الخيارات (فاصلة)', aliases: ['الخيارات','options'], type: 'array' },
      { key: 'is_required', label: 'مطلوب (نعم/لا)', aliases: ['مطلوب','required'], type: 'boolean', default: false },
      { key: 'is_readonly', label: 'للقراءة فقط (نعم/لا)', aliases: ['للقراءة فقط','readonly'], type: 'boolean', default: false },
      { key: 'visible_for_student', label: 'ظاهر (نعم/لا)', aliases: ['ظاهر','visible'], type: 'boolean', default: true },
      { key: 'display_order', label: 'ترتيب الحقل', aliases: ['الترتيب','order'], type: 'number', default: 0 }
    ]
  },
  sections: {
    label: 'الأقسام',
    table: 'form_sections',
    match: 'name',
    columns: [
      { key: 'name', label: 'اسم القسم', aliases: ['القسم','name'], required: true, type: 'text' },
      { key: 'display_order', label: 'الترتيب', aliases: ['order'], type: 'number', default: 0 },
      { key: 'is_active', label: 'مفعّل (نعم/لا)', aliases: ['active'], type: 'boolean', default: true }
    ]
  }
};

let currentSchema = 'students';
let parsedRows = [];
let selectedColumns = new Set();
let auth0 = null;
let availableFields = [];

// ==========================================================
// التهيئة
// ==========================================================
(async () => {
  auth0 = await Auth.requireAdmin();
  if (!auth0) return;
  await selectSchema('students');
})();

function switchTab(t) {
  document.getElementById('panel-import').style.display = t === 'import' ? 'block' : 'none';
  document.getElementById('panel-export').style.display = t === 'export' ? 'block' : 'none';
  document.getElementById('tab-import').classList.toggle('active', t === 'import');
  document.getElementById('tab-export').classList.toggle('active', t === 'export');
}

async function selectSchema(s) {
  currentSchema = s;
  parsedRows = [];
  selectedColumns.clear();

  document.getElementById('schema-students').classList.toggle('active', s === 'students');
  document.getElementById('schema-responses').classList.toggle('active', s === 'responses');
  document.getElementById('schema-fields').classList.toggle('active', s === 'fields');
  document.getElementById('schema-sections').classList.toggle('active', s === 'sections');

  const infoBox = document.getElementById('infoBox');

  if (s === 'responses') {
    await loadDynamicFields();
    SCHEMAS.responses.columns = [
      { key: 'student_code', label: 'الكود', aliases: ['كود','code'], required: true, type: 'text' },
      ...availableFields.map(f => ({
        key: f.id,
        field_key: f.field_key,
        label: f.name,
        aliases: [f.name, f.field_key],
        required: false,
        type: 'text',
        is_readonly: f.is_readonly,
        _field: f
      }))
    ];
    infoBox.className = 'info-box green';
    infoBox.innerHTML = `
      <strong>📊 استجابات الطلاب</strong><br>
      هذا التبويب لتعبئة بيانات الحقول الديناميكية لكل طالب.<br>
      <strong>الكود</strong> إجباري. الحقول الأخرى اختيارية — اختر أي حقول تريد تعبئتها فقط.<br>
      💡 <strong>مثال</strong>: تريد إضافة "الصف" لكل الطلاب — اختر حقل "الصف" فقط + الكود.
    `;
  } else {
    const sc = SCHEMAS[s];
    infoBox.className = 'info-box';
    infoBox.innerHTML = `
      <strong>📋 ${sc.label}</strong><br>
      الأعمدة المطلوبة: <strong>${sc.columns.filter(c=>c.required).map(c=>c.label).join('، ')}</strong><br>
      الأعمدة الاختيارية: ${sc.columns.filter(c=>!c.required).map(c=>c.label).join('، ') || '—'}
    `;
  }

  document.getElementById('preview').style.display = 'none';
  document.getElementById('columnPicker').style.display = 'none';
  document.getElementById('result').className = 'result';
  document.getElementById('fileInput').value = '';
}

async function loadDynamicFields() {
  const { data, error } = await SB.from('dynamic_fields')
    .select('*')
    .order('display_order');
  if (error) { Toast.show('خطأ في تحميل الحقول: ' + error.message, 'error'); return; }
  availableFields = data || [];
}

// ==========================================================
// تحميل النموذج (نستخدم exportExcelFile الجديد)
// ==========================================================
function downloadTemplate() {
  const sc = SCHEMAS[currentSchema];

  if (currentSchema === 'responses') {
    const headers = ['الكود', ...availableFields.map(f => f.name)];
    const sample = ['مثال الكود', ...availableFields.map(f => f.type === 'select' ? (f.options?.[0] || '') : `مثال ${f.name}`)];
    const empty = headers.map(() => '');
    exportExcelFile(headers, [sample, empty, empty], `نموذج_${sc.label}.xlsx`);
    Toast.show('✅ تم تحميل النموذج — املأ الحقول التي تحتاجها فقط', 'info');
    return;
  }

  const headers = sc.columns.map(c => c.label);
  const sample = sc.columns.map(c => c.default !== undefined ? String(c.default) : (c.required ? `مثال ${c.label}` : ''));
  const empty = sc.columns.map(() => '');
  exportExcelFile(headers, [sample, empty, empty], `نموذج_${sc.label}.xlsx`);
  Toast.show('✅ تم تحميل النموذج', 'info');
}

// ==========================================================
// قراءة الملف (باستخدام readExcelFile الجديد)
// ==========================================================
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    parsedRows = await readExcelFile(f);
    if (parsedRows.length === 0) { Toast.show('الملف فارغ', 'error'); return; }
    renderPreview();
    renderColumnPicker();
    Toast.show(`✅ ${parsedRows.length} صف — تم قراءة القيم كما هي`, 'info');
  } catch (err) { Toast.show('فشل القراءة: ' + err.message, 'error'); }
});

// ==========================================================
// منتقي الحقول
// ==========================================================
function renderColumnPicker() {
  const sc = SCHEMAS[currentSchema];
  const picker = document.getElementById('columnPicker');
  const grid = document.getElementById('columnPickerGrid');

  selectedColumns.clear();

  if (currentSchema === 'responses') {
    document.getElementById('pickerTitle').textContent = '🔧 اختر الحقول التي تريد تعبئتها';
    document.getElementById('pickerHint').innerHTML = `
      💡 <strong>الحقول التي تحددها فقط سيتم تحديث قيمتها</strong> لكل الطلاب في الملف.
      الحقل "الكود" إجباري لتحديد الطالب.
    `;

    selectedColumns.add('student_code');

    availableFields.forEach(f => {
      const hasData = parsedRows.some(r => {
        const v = findVal(r, { key: f.id, label: f.name, aliases: [f.field_key] });
        return v !== '' && v != null;
      });
      if (hasData) selectedColumns.add(f.id);
    });

    grid.innerHTML = sc.columns.map(col => {
      const isSelected = selectedColumns.has(col.key);
      const isLocked = col.key === 'student_code';
      const field = col._field;
      const samples = parsedRows.map(r => findVal(r, col)).filter(v => v !== '' && v != null);
      const sample = samples[0] || '—';

      return `
        <label class="column-pick ${isSelected ? 'selected' : ''}" data-key="${col.key}">
          <input type="checkbox" ${isSelected ? 'checked' : ''}
                 ${isLocked ? 'disabled' : ''}
                 onchange="toggleColumn('${col.key}', this.checked)">
          <div class="info">
            <div class="name">
              ${isLocked ? '<span class="required-badge">🔑</span>' : ''}
              ${field?.is_readonly ? '<span class="type-badge">🔒</span>' : ''}
              ${esc(col.label)}
            </div>
            <div class="sample" title="${esc(String(sample))}">مثال: ${esc(String(sample).substring(0, 18))}</div>
          </div>
        </label>
      `;
    }).join('');

  } else {
    document.getElementById('pickerTitle').textContent = '🔧 اختر الحقول التي تريد استيرادها';
    document.getElementById('pickerHint').innerHTML = `
      💡 <strong>الحقول التي لن تحددها لن يتم تعديلها</strong> حتى لو كانت في الملف.
      ${currentSchema === 'students' ? '🔑 <strong>الكود</strong> إجباري.' : ''}
    `;

    sc.columns.forEach(col => {
      const hasData = parsedRows.some(r => {
        const v = findVal(r, col);
        return v !== '' && v != null;
      });
      if (hasData) selectedColumns.add(col.key);
    });

    if (currentSchema === 'students' && selectedColumns.size > 0) {
      selectedColumns.add('student_code');
    }

    grid.innerHTML = sc.columns.map(col => {
      const isSelected = selectedColumns.has(col.key);
      const isLocked = (currentSchema === 'students' && col.key === 'student_code');
      const samples = parsedRows.map(r => findVal(r, col)).filter(v => v !== '' && v != null);
      const sample = samples[0] || '—';

      return `
        <label class="column-pick ${isSelected ? 'selected' : ''}" data-key="${col.key}">
          <input type="checkbox" ${isSelected ? 'checked' : ''}
                 ${isLocked ? 'disabled' : ''}
                 onchange="toggleColumn('${col.key}', this.checked)">
          <div class="info">
            <div class="name">
              ${isLocked ? '<span class="required-badge">🔑</span>' : ''}
              ${col.required && !isLocked ? '<span class="req-star">*</span>' : ''}
              ${esc(col.label)}
            </div>
            <div class="sample" title="${esc(String(sample))}">مثال: ${esc(String(sample).substring(0, 18))}</div>
          </div>
        </label>
      `;
    }).join('');
  }

  picker.style.display = 'block';
}

function toggleColumn(key, checked) {
  const el = document.querySelector(`.column-pick[data-key="${key}"]`);
  if (checked) {
    selectedColumns.add(key);
    if (el) el.classList.add('selected');
  } else {
    selectedColumns.delete(key);
    if (el) el.classList.remove('selected');
  }
}

function toggleAllColumns(selectAll) {
  document.querySelectorAll('.column-pick').forEach(el => {
    const key = el.dataset.key;
    const cb = el.querySelector('input');
    if (cb.disabled) return;

    if (selectAll) {
      selectedColumns.add(key);
      cb.checked = true;
      el.classList.add('selected');
    } else {
      selectedColumns.delete(key);
      cb.checked = false;
      el.classList.remove('selected');
    }
  });
}

// المعاينة (مع dir="ltr" لكل خلية عشان الباسورد يظهر صح)

// ==========================================================
// دوال مساعدة
// ==========================================================
function findVal(row, col) {
  const keys = [col.label, col.key, ...(col.aliases||[])];
  for (const k of keys) {
    if (row[k] !== undefined && row[k] !== '') return row[k];
  }
  const rowKeys = Object.keys(row);
  for (const k of keys) {
    const found = rowKeys.find(rk => rk.trim().toLowerCase() === k.trim().toLowerCase());
    if (found && row[found] !== '') return row[found];
  }
  return '';
}

function toBool(v) {
  if (v === true || v === false) return v;
  const s = String(v).trim().toLowerCase();
  return ['true','1','yes','نعم','صح','✔','✓'].includes(s);
}
function toNum(v) {
  if (v === '' || v == null) return null;
  const n = Number(String(v).replace(/[^\d.-]/g, ''));
  return isNaN(n) ? null : n;
}
function toArr(v) {
  if (v === '' || v == null) return null;
  return String(v).split(',').map(s=>s.trim()).filter(Boolean);
}

// ✅ نستخدم sanitizeText لكل حقل نصي
function convertRow(row, sc) {
  const out = {};
  for (const col of sc.columns) {
    if (!selectedColumns.has(col.key)) continue;

    let raw = findVal(row, col);
    if (raw === '' || raw == null) {
      if (col.default !== undefined) out[col.key] = col.default;
      continue;
    }
    switch (col.type) {
      case 'boolean': out[col.key] = toBool(raw); break;
      case 'number': out[col.key] = toNum(raw); break;
      case 'array': out[col.key] = toArr(raw); break;
      default:
        out[col.key] = sanitizeText(String(raw));
    }
  }
  return out;
}

// ==========================================================
// النسخة الاحتياطية (بتصدير نظيف)
// ==========================================================
async function backupStudents() {
  try {
    const { data, error } = await SB.from('students').select('*');
    if (error) throw error;
    if (!data || data.length === 0) return Toast.show('لا توجد بيانات', 'warn');

    const headers = ['student_code','national_id','full_name','grade','enrollment_status','gender','date_of_birth','governorate','stream','specialization','track','optional_subject','is_locked','submitted_at','is_active','created_at'];
    const rows = data.map(s => headers.map(h => sanitizeText(String(s[h] ?? ''))));
    exportExcelFile(headers, rows, `نسخة_احتياطية_${new Date().toISOString().slice(0,10)}_${Date.now()}.xlsx`);
    Toast.show(`✅ تم تنزيل ${data.length} صف كنسخة احتياطية`, 'success');
  } catch (err) { Toast.show('خطأ: ' + err.message, 'error'); }
}

// ==========================================================
// الاستيراد
// ==========================================================
async function doImport() {
  if (parsedRows.length === 0) return Toast.show('ارفع ملفاً أولاً', 'warn');
  if (selectedColumns.size === 0) return Toast.show('❌ اختر حقلاً واحداً على الأقل', 'error');
  if (currentSchema === 'students' && !selectedColumns.has('student_code'))
    return Toast.show('❌ يجب تحديد حقل "الكود"', 'error');
  if (currentSchema === 'responses' && !selectedColumns.has('student_code'))
    return Toast.show('❌ يجب تحديد حقل "الكود"', 'error');

  const sc = SCHEMAS[currentSchema];
  const mode = document.querySelector('input[name=mode]:checked').value;
  const btn = document.getElementById('importBtn');
  const progress = document.getElementById('progress');
  const bar = document.getElementById('progressBar');
  const res = document.getElementById('result');

  if (mode === 'replace' && currentSchema === 'students') {
    if (!confirm('⚠️ تحذير: سيتم استبدال بيانات الطلاب. هل أخذت نسخة احتياطية؟')) return;
  }

  btn.disabled = true;
  progress.classList.add('show');
  bar.style.width = '0%';
  res.className = 'result';

  try {
    const CHUNK_SIZE = 500;

    if (currentSchema === 'responses') {
      const codes = new Set();
      for (const row of parsedRows) {
        const c = findVal(row, { label: 'الكود', key: 'student_code', aliases: ['كود','code'] });
        if (c) codes.add(String(c).trim());
      }
      if (codes.size === 0) throw new Error('لا يوجد عمود كود في الملف');

      const { data: studentList, error: sErr } = await SB.from('students')
        .select('id, student_code').in('student_code', [...codes]);
      if (sErr) throw sErr;
      const studentMap = {};
      (studentList || []).forEach(s => studentMap[s.student_code] = s.id);

      const selectedFieldIds = [...selectedColumns].filter(k => k !== 'student_code');
      if (selectedFieldIds.length === 0) throw new Error('اختر حقلاً واحداً على الأقل');

      const allRecords = [];
      parsedRows.forEach((row) => {
        const codeVal = findVal(row, { label: 'الكود', key: 'student_code', aliases: ['كود','code'] });
        if (!codeVal) return;
        const code = String(codeVal).trim();
        const sid = studentMap[code];
        if (!sid) return;

        for (const fieldId of selectedFieldIds) {
          const field = availableFields.find(f => f.id === fieldId);
          if (!field) continue;
          const raw = findVal(row, { key: field.id, label: field.name, aliases: [field.field_key] });
          if (raw === '' || raw == null) continue;
          allRecords.push({ student_code: code, field_id: fieldId, value: sanitizeText(String(raw)) });
        }
      });

      const payloads = [];
      for (let i = 0; i < allRecords.length; i += CHUNK_SIZE) {
        payloads.push(allRecords.slice(i, i + CHUNK_SIZE));
      }

      let totalSuccess = 0, totalFailed = 0, totalSkipped = 0;
      const allErrors = [];

      for (let pi = 0; pi < payloads.length; pi++) {
        const { data, error } = await SB.rpc('bulk_import_responses', {
          p_payload: payloads[pi],
          p_mode: mode
        });
        if (error) { allErrors.push('دفعة ' + (pi+1) + ': ' + error.message); continue; }
        totalSuccess += data.success || 0;
        totalFailed  += data.failed  || 0;
        totalSkipped += data.skipped || 0;
        (data.errors || []).forEach(e => allErrors.push(e));
        bar.style.width = Math.round(((pi + 1) / payloads.length) * 100) + '%';
      }

      await finishImport(sc, mode, totalSuccess, totalFailed, totalSkipped, allErrors);
      return;
    }

    const converted = [];
    for (let i = 0; i < parsedRows.length; i++) {
      try { converted.push(convertRow(parsedRows[i], sc)); }
      catch (e) { }
    }

    let normalized = converted;
    if (currentSchema === 'fields') {
      const { data: existingSecs } = await SB.from('form_sections').select('id, name');
      const secMap = {};
      (existingSecs || []).forEach(s => secMap[s.name.trim()] = s.id);

      const newOnes = new Set();
      normalized.forEach(c => {
        const n = (c.section_name || '').trim();
        if (n && !secMap[n]) newOnes.add(n);
      });
      if (newOnes.size > 0) {
        const startOrder = (existingSecs || []).length;
        const toInsert = [...newOnes].map((name, i) => ({
          name, display_order: startOrder + i, is_active: true
        }));
        const { data: created } = await SB.from('form_sections').insert(toInsert).select();
        (created || []).forEach(s => secMap[s.name.trim()] = s.id);
      }
      normalized = converted.map(c => {
        const n = (c.section_name || '').trim();
        delete c.section_name;
        c.section_id = (n && secMap[n]) ? secMap[n] : null;
        return c;
      });
    }

    if (currentSchema === 'students') {
      const payloadChunks = [];
      for (let i = 0; i < normalized.length; i += CHUNK_SIZE) {
        payloadChunks.push(normalized.slice(i, i + CHUNK_SIZE));
      }

      let totalSuccess = 0, totalFailed = 0, totalSkipped = 0;
      const allErrors = [];

      for (let pi = 0; pi < payloadChunks.length; pi++) {
        const { data, error } = await SB.rpc('bulk_import_students', {
          p_payload: payloadChunks[pi],
          p_mode: mode
        });
        if (error) { allErrors.push('دفعة ' + (pi+1) + ': ' + error.message); continue; }
        totalSuccess += data.success || 0;
        totalFailed  += data.failed  || 0;
        totalSkipped += data.skipped || 0;
        (data.errors || []).forEach(e => allErrors.push(e));
        bar.style.width = Math.round(((pi + 1) / payloadChunks.length) * 100) + '%';
      }

      await finishImport(sc, mode, totalSuccess, totalFailed, totalSkipped, allErrors);
      return;
    }

    let success = 0, failed = 0, skipped = 0;
    const errors = [];
    for (let i = 0; i < normalized.length; i++) {
      const c = normalized[i];
      try {
        if (mode === 'insert') {
          const { error } = await SB.from(sc.table).insert(c);
          if (error) {
            if (error.code === '23505') skipped++;
            else { failed++; errors.push('صف ' + (i+2) + ': ' + error.message); }
          } else success++;
        } else {
          const { error } = await SB.from(sc.table).upsert(c, { onConflict: sc.match });
          if (error) { failed++; errors.push('صف ' + (i+2) + ': ' + error.message); }
          else success++;
        }
      } catch (e) { failed++; errors.push(e.message); }
      bar.style.width = Math.round(((success + failed + skipped) / normalized.length) * 100) + '%';
    }
    await finishImport(sc, mode, success, failed, skipped, errors);

  } catch (err) {
    btn.disabled = false;
    progress.classList.remove('show');
    Toast.show('❌ ' + err.message, 'error', 6000);
  }
}

async function finishImport(sc, mode, success, failed, skipped, errors) {
  try {
    await SB.from('admin_logs').insert({
      admin_id: auth0.user.id, admin_email: auth0.user.email,
      action: `استيراد ${sc.label} (${mode})`,
      details: `نجح: ${success}، فشل: ${failed}، تخطي: ${skipped}`
    });
  } catch(e) { console.warn(e); }

  const res = document.getElementById('result');
  res.className = `result show ${failed === 0 ? 'success' : success > 0 ? 'partial' : 'error'}`;
  res.innerHTML = `
    <div class="stats-grid">
      <div class="stat-box"><div class="num" style="color:#28a745;">${success}</div><div class="lbl">✅ نجح</div></div>
      <div class="stat-box"><div class="num" style="color:#dc3545;">${failed}</div><div class="lbl">❌ فشل</div></div>
      <div class="stat-box"><div class="num" style="color:#ffc107;">${skipped}</div><div class="lbl">⏭️ تخطي</div></div>
    </div>
    ${errors.length > 0 ? `<details style="margin-top:10px;">
      <summary style="cursor:pointer;font-weight:600;">الأخطاء (${errors.length})</summary>
      <ul style="max-height:200px;overflow:auto;margin-top:8px;font-size:13px;">
        ${errors.slice(0, 50).map(e => `<li>${esc(typeof e === 'string' ? e : JSON.stringify(e))}</li>`).join('')}
      </ul></details>` : ''}
  `;

  document.getElementById('importBtn').disabled = false;
  document.getElementById('progress').classList.remove('show');
  if (success > 0) Toast.show(`✅ ${success} صف معالج`, 'success');
}

// ==========================================================
// التصدير (باستخدام exportExcelFile النظيف)
// ==========================================================
async function exportData(schemaKey) {
  const sc = SCHEMAS[schemaKey];
  let data, error;

  if (schemaKey === 'fields') {
    const { data: fData, error: fErr } = await SB.from('dynamic_fields')
      .select('*, form_sections(name)').order('display_order');
    if (fErr) return Toast.show('خطأ: ' + fErr.message, 'error');
    data = (fData || []).map(f => ({ ...f, section_name: f.form_sections?.name || '' }));
  } else {
    const res = await SB.from(sc.table).select('*');
    data = res.data; error = res.error;
  }

  if (error) return Toast.show('خطأ: ' + error.message, 'error');
  if (!data || data.length === 0) return Toast.show('لا بيانات', 'warn');

  const headers = sc.columns.map(c => c.label);
  const rows = data.map(row => sc.columns.map(c => {
    const v = row[c.key];
    if (v == null) return '';
    if (Array.isArray(v)) return v.map(x => sanitizeText(String(x))).join(', ');
    if (typeof v === 'boolean') return v ? 'نعم' : 'لا';
    return sanitizeText(String(v));
  }));

  exportExcelFile(headers, rows, `${sc.label}_${new Date().toISOString().slice(0,10)}.xlsx`);
  try {
    await SB.from('admin_logs').insert({
      admin_id: auth0.user.id, admin_email: auth0.user.email,
      action: `تصدير ${sc.label}`, details: `${data.length} صف`
    });
  } catch(e) { console.warn(e); }
  Toast.show(`✅ ${data.length} صف تم تصديره`, 'success');
}

async function exportResponses() {
  const { data: students } = await SB.from('students').select('id,student_code,full_name,grade,enrollment_status,gender,date_of_birth,governorate,stream,specialization,track,optional_subject,is_locked,submitted_at');
  const { data: fields } = await SB.from('dynamic_fields').select('id,name').eq('visible_for_student', true).order('display_order');
  if (!students || students.length === 0) return Toast.show('لا بيانات', 'warn');
  const ids = students.map(s => s.id);
  const { data: responses } = await SB.from('student_dynamic_responses').select('student_id,field_id,value').in('student_id', ids);
  const map = {};
  (responses||[]).forEach(r => { (map[r.student_id] ??= {})[r.field_id] = r.value; });
  const headers = ['#','الاسم','الكود','الصف','حالة القيد','النوع','تاريخ الميلاد','المحافظة','التشعيب','التخصص','المسار','المادة الاختيارية','الحالة','تاريخ التقديم',...(fields||[]).map(f=>f.name)];
  const rows = students.map((s,i) => [
    String(i+1),
    sanitizeText(s.full_name || ''),
    sanitizeText(s.student_code || ''),
    sanitizeText(s.grade || ''),
    sanitizeText(s.enrollment_status || ''),
    sanitizeText(s.gender || ''),
    s.date_of_birth ? new Date(s.date_of_birth).toLocaleDateString('ar-EG') : '',
    sanitizeText(s.governorate || ''),
    sanitizeText(s.stream || ''),
    sanitizeText(s.specialization || ''),
    sanitizeText(s.track || ''),
    sanitizeText(s.optional_subject || ''),
    s.is_locked?'مقفل':'مفتوح',
    s.submitted_at?new Date(s.submitted_at).toLocaleString('ar-EG'):'',
    ...(fields||[]).map(f => sanitizeText(map[s.id]?.[f.id] || ''))
  ]);
  exportExcelFile(headers, rows, `استجابات_كاملة_${new Date().toISOString().slice(0,10)}.xlsx`);
  Toast.show(`✅ ${students.length} صف`, 'success');
}
