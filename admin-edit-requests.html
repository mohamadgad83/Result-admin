<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات تعديل الحقول</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<style>
.admin-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-bottom:15px;border-bottom:2px solid #eee;margin-bottom:20px}
.btn{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block;font-weight:600}
.btn-gray{background:#6c757d;color:#fff}
.btn-red{background:#dc3545;color:#fff}
.btn-green{background:#28a745;color:#fff}
.btn-blue{background:#17a2b8;color:#fff}
.stats-bar{display:flex;gap:20px;flex-wrap:wrap;padding:14px;background:#f8f9fa;border-radius:12px;margin-bottom:15px;font-size:14px}
.stats-bar strong{color:#1e3c72;font-size:18px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.filters select,.filters input{padding:10px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit}
.req-card{background:#f8f9fa;border-radius:14px;padding:20px;margin-bottom:12px;border-right:5px solid #ffc107;transition:all .2s}
.req-card.approved{border-right-color:#28a745;background:#f0fff4}
.req-card.rejected{border-right-color:#dc3545;background:#fff5f5}
.req-card .head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.req-card .name{font-size:17px;font-weight:700;color:#1e3c72}
.req-card .status{padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600}
.status.pending{background:#fff3cd;color:#856404}
.status.approved{background:#d4edda;color:#155724}
.status.rejected{background:#f8d7da;color:#721c24}
.req-card .field-info{background:#fff;padding:14px;border-radius:10px;margin:10px 0;border:1px solid #e0e0e0}
.req-card .field-info .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0}
.req-card .field-info .row:last-child{border-bottom:none}
.req-card .field-info .lbl{color:#666;font-size:13px}
.req-card .field-info .old{color:#dc3545;font-weight:600;text-decoration:line-through;padding:2px 8px;background:#fee;border-radius:6px}
.req-card .field-info .new{color:#28a745;font-weight:700;padding:2px 8px;background:#d4edda;border-radius:6px}
.req-card .reason{background:#fff;padding:12px;border-radius:10px;margin:10px 0;font-size:14px;border:1px solid #e0e0e0}
.req-card .response{background:#e8f4fd;padding:10px;border-radius:8px;margin:10px 0;font-size:13px;border:1px solid #bee5eb}
.req-card .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:16px;padding:26px;max-width:520px;width:100%}
.modal-content h3{color:#1e3c72;margin:0 0 12px}
.modal-content textarea{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-family:inherit;min-height:80px;resize:vertical}
.modal-content .diff{background:#f8f9fa;padding:12px;border-radius:10px;margin:10px 0;font-size:13px}
.modal-content .diff .old{color:#dc3545;text-decoration:line-through}
.modal-content .diff .new{color:#28a745;font-weight:700}
.modal-actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
.modal-actions button{flex:1;min-width:100px;padding:10px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
.empty{text-align:center;padding:40px;color:#999;font-size:40px}
.empty .icon{display:block;margin-bottom:10px}
</style>
</head>
<body>
<div class="container" style="max-width:950px;">
<div class="card">
  <div class="admin-header">
    <h1 style="margin:0;font-size:22px;">📩 طلبات تعديل الحقول</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a href="admin-dashboard.html" class="btn btn-gray">📊 لوحة التحكم</a>
      <button class="btn btn-red" onclick="Auth.adminLogout()">🚪 خروج</button>
    </div>
  </div>

  <div class="stats-bar">
    <span>⏳ معلق: <strong id="pendingCount">0</strong></span>
    <span>✅ موافق: <strong id="approvedCount">0</strong></span>
    <span>❌ مرفوض: <strong id="rejectedCount">0</strong></span>
    <span>📊 الإجمالي: <strong id="totalCount">0</strong></span>
  </div>

  <div class="filters">
    <select id="filterStatus" onchange="load()">
      <option value="">كل الطلبات</option>
      <option value="pending">⏳ معلق</option>
      <option value="approved">✅ موافق</option>
      <option value="rejected">❌ مرفوض</option>
    </select>
    <input type="text" id="search" placeholder="🔍 بحث بالاسم أو الكود..." oninput="render()">
    <button class="btn btn-blue" onclick="load()">🔄 تحديث</button>
  </div>

  <div id="list"><div class="empty"><span class="icon">⏳</span>جاري التحميل...</div></div>
</div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">الرد على الطلب</h3>
    <p style="font-size:13px;color:#666;margin:0 0 8px;" id="modalInfo"></p>
    <div class="diff" id="modalDiff"></div>
    <textarea id="responseText" placeholder="اكتب ردك للطالب (اختياري)..."></textarea>
    <div class="modal-actions">
      <button style="background:#28a745;color:#fff;" onclick="respond('approved')">✅ موافقة وتطبيق</button>
      <button style="background:#dc3545;color:#fff;" onclick="respond('rejected')">❌ رفض</button>
      <button style="background:#6c757d;color:#fff;" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<script src="lib/supabase.js"></script>
<script src="lib/auth.js"></script>
<script src="lib/toast.js"></script>
<script src="lib/escape.js"></script>
<script>
let requests = [], currentId = null, currentReq = null, auth0 = null;

(async () => {
  auth0 = await Auth.requireAdmin();
  if (!auth0) return;
  load();
})();

async function load() {
  const status = document.getElementById('filterStatus').value;
  let q = SB.from('edit_requests')
    .select('*, students(full_name, student_code, grade)')
    .order('requested_at', { ascending: false });
  if (status) q = q.eq('status', status);
  const { data, error } = await q;
  if (error) return Toast.show('خطأ: ' + error.message, 'error');
  requests = data || [];
  updateStats();
  render();
}

function updateStats() {
  document.getElementById('pendingCount').textContent = requests.filter(r => r.status === 'pending').length;
  document.getElementById('approvedCount').textContent = requests.filter(r => r.status === 'approved').length;
  document.getElementById('rejectedCount').textContent = requests.filter(r => r.status === 'rejected').length;
  document.getElementById('totalCount').textContent = requests.length;
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const list = requests.filter(r => {
    if (!search) return true;
    const name = (r.students?.full_name || '').toLowerCase();
    const code = (r.students?.student_code || '').toString();
    return name.includes(search) || code.includes(search);
  });

  const el = document.getElementById('list');
  if (list.length === 0) {
    el.innerHTML = '<div class="empty"><span class="icon">📭</span>لا توجد طلبات</div>';
    return;
  }

  const labels = { pending: '⏳ معلق', approved: '✅ موافق', rejected: '❌ مرفوض' };

  el.innerHTML = list.map(r => `
    <div class="req-card ${r.status}">
      <div class="head">
        <div>
          <div class="name">👨‍🎓 ${esc(r.students?.full_name || 'غير معروف')}</div>
          <div style="font-size:12px;color:#666;margin-top:3px;">
            الكود: ${esc(r.students?.student_code || '-')} • الصف: ${esc(r.students?.grade || '-')}
          </div>
        </div>
        <span class="status ${r.status}">${labels[r.status]}</span>
      </div>
      <div class="field-info">
        <div class="row"><span class="lbl">الحقل:</span><strong>${esc(r.field_label)}</strong></div>
        <div class="row"><span class="lbl">القيمة الحالية:</span><span class="old">${esc(r.old_value || '—')}</span></div>
        <div class="row"><span class="lbl">القيمة المطلوبة:</span><span class="new">${esc(r.new_value)}</span></div>
        <div class="row"><span class="lbl">التاريخ:</span><span style="font-size:12px;color:#666;">${new Date(r.requested_at).toLocaleString('ar-EG')}</span></div>
      </div>
      <div class="reason"><strong>📝 السبب:</strong> ${esc(r.reason)}</div>
      ${r.admin_response ? `<div class="response"><strong>📩 ردك:</strong> ${esc(r.admin_response)}</div>` : ''}
      <div class="actions">
        ${r.status === 'pending' ? `<button class="btn btn-green" onclick='openModal("${r.id}")'>✅ معالجة</button>` : ''}
      </div>
    </div>
  `).join('');
}

function openModal(id) {
  currentId = id;
  currentReq = requests.find(r => r.id === id);
  if (!currentReq) return;
  document.getElementById('modalInfo').textContent =
    `${currentReq.students?.full_name || ''} • ${currentReq.field_label}`;
  document.getElementById('modalDiff').innerHTML =
    `<div>القيمة الحالية: <span class="old">${esc(currentReq.old_value || '—')}</span></div>
     <div style="margin-top:6px;">القيمة الجديدة: <span class="new">${esc(currentReq.new_value)}</span></div>`;
  document.getElementById('responseText').value = '';
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  currentId = null; currentReq = null;
}

async function respond(action) {
  if (!currentId || !currentReq) return;
  const resp = document.getElementById('responseText').value.trim();

  try {
    // إذا موافقة: طبق التعديل أولاً
    if (action === 'approved') {
      if (currentReq.target_type === 'core') {
        const fieldKey = currentReq.field_key;
        let updateData = {};
        if (fieldKey === 'date_of_birth') {
          updateData[fieldKey] = currentReq.new_value;
        } else {
          updateData[fieldKey] = currentReq.new_value;
        }
        const { error: e1 } = await SB.from('students').update(updateData).eq('id', currentReq.student_id);
        if (e1) throw e1;
      } else if (currentReq.target_type === 'dynamic' && currentReq.field_id) {
        const { error: e2 } = await SB.from('student_dynamic_responses').upsert({
          student_id: currentReq.student_id,
          field_id: currentReq.field_id,
          value: currentReq.new_value
        }, { onConflict: 'student_id,field_id' });
        if (e2) throw e2;
      }
    }

    const { error: e3 } = await SB.from('edit_requests').update({
      status: action,
      admin_response: resp || null,
      responded_at: new Date().toISOString(),
      admin_id: auth0.user.id
    }).eq('id', currentId);
    if (e3) throw e3;

    await SB.from('admin_logs').insert({
      admin_id: auth0.user.id, admin_email: auth0.user.email,
      action: action === 'approved' ? 'موافقة على تعديل' : 'رفض تعديل',
      details: `${currentReq.field_label}: ${currentReq.old_value} → ${currentReq.new_value}`,
      student_id: currentReq.student_id,
      student_name: currentReq.students?.full_name
    });

    Toast.show(`✅ تم ${action === 'approved' ? 'الموافقة والتطبيق' : 'الرفض'}`);
    closeModal();
    load();
  } catch (err) {
    Toast.show('خطأ: ' + err.message, 'error');
  }
}
</script>
</body>
</html>
