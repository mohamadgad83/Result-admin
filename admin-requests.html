<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات فتح التعديل</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<style>
.admin-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-bottom:15px;border-bottom:2px solid #eee;margin-bottom:20px}
.btn{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block;font-weight:600}
.btn-gray{background:#6c757d;color:#fff}.btn-red{background:#dc3545;color:#fff}
.btn-green{background:#28a745;color:#fff}.btn-blue{background:#1e3c72;color:#fff}
.stats-bar{display:flex;gap:20px;flex-wrap:wrap;padding:14px;background:#f8f9fa;border-radius:12px;margin-bottom:15px;font-size:14px}
.stats-bar strong{color:#1e3c72;font-size:18px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.filters select,.filters input{padding:10px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit}
.req-card{background:#f8f9fa;border-radius:14px;padding:20px;margin-bottom:12px;border-right:5px solid #ffc107}
.req-card.approved{border-right-color:#28a745;background:#f0fff4}
.req-card.rejected{border-right-color:#dc3545;background:#fff5f5}
.req-card .head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.req-card .name{font-size:17px;font-weight:700;color:#1e3c72}
.req-card .status{padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600}
.status.pending{background:#fff3cd;color:#856404}
.status.approved{background:#d4edda;color:#155724}
.status.rejected{background:#f8d7da;color:#721c24}
.req-card .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;margin:10px 0;color:#555}
.req-card .meta .lbl{color:#999;font-size:11px}
.req-card .reason{background:#fff;padding:14px;border-radius:10px;margin:10px 0;border:1px solid #eee}
.req-card .response{background:#e8f4fd;padding:10px;border-radius:8px;margin:10px 0;font-size:13px}
.req-card .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:16px;padding:26px;max-width:480px;width:100%}
.modal-content h3{color:#1e3c72;margin:0 0 12px}
.modal-content textarea{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-family:inherit;min-height:80px;resize:vertical}
.modal-content textarea:focus{outline:none;border-color:#1e3c72}
.modal-actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
.modal-actions button{flex:1;min-width:100px;padding:10px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
.empty{text-align:center;padding:40px;color:#999;font-size:40px}
@media(max-width:600px){.req-card .meta{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container" style="max-width:900px;">
<div class="card">
  <div class="admin-header">
    <h1 style="margin:0;font-size:22px;">📩 طلبات فتح التعديل</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a href="admin-dashboard.html" class="btn btn-gray">📊 لوحة التحكم</a>
      <button class="btn btn-red" onclick="Auth.adminLogout()">🚪 خروج</button>
    </div>
  </div>

  <div class="stats-bar">
    <span>⏳ قيد الانتظار: <strong id="pendingCount">0</strong></span>
    <span>✅ موافق: <strong id="approvedCount">0</strong></span>
    <span>❌ مرفوض: <strong id="rejectedCount">0</strong></span>
    <span>📊 الإجمالي: <strong id="totalCount">0</strong></span>
  </div>

  <div class="filters">
    <select id="filterStatus" onchange="load()">
      <option value="">كل الطلبات</option>
      <option value="pending">⏳ قيد الانتظار</option>
      <option value="approved">✅ موافق</option>
      <option value="rejected">❌ مرفوض</option>
    </select>
    <input type="text" id="search" placeholder="🔍 بحث بالاسم..." oninput="render()">
    <button class="btn btn-blue" onclick="load()">🔄 تحديث</button>
  </div>

  <div id="list"></div>
</div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle">الرد على الطلب</h3>
    <p style="font-size:13px;color:#666;margin:0 0 8px;" id="modalStudent"></p>
    <p style="font-size:13px;color:#555;background:#f8f9fa;padding:10px;border-radius:8px;" id="modalReason"></p>
    <textarea id="responseText" placeholder="اكتب ردك (اختياري)..."></textarea>
    <div class="modal-actions">
      <button style="background:#28a745;color:#fff;" onclick="submit('approved')">✅ موافقة</button>
      <button style="background:#dc3545;color:#fff;" onclick="submit('rejected')">❌ رفض</button>
      <button style="background:#6c757d;color:#fff;" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<script src="lib/supabase.js"></script>
<script src="lib/auth.js"></script>
<script src="lib/toast.js"></script>
<script src="lib/escape.js"></script>
<script>
let requests = [], currentId = null, auth0 = null;

(async () => {
  auth0 = await Auth.requireAdmin();
  if (!auth0) return;
  load();
})();

async function load() {
  const status = document.getElementById('filterStatus').value;
  let q = SB.from('reopen_requests').select('*').order('requested_at', {ascending:false});
  if (status) q = q.eq('status', status);
  const { data, error } = await q;
  if (error) return Toast.show('خطأ: ' + error.message, 'error');
  requests = data || [];
  updateStats();
  render();
}

function updateStats() {
  document.getElementById('pendingCount').textContent = requests.filter(r => r.status === 'pending').length;
  document.getElementById('approvedCount').textContent = requests.filter(r => r.status === 'approved').length;
  document.getElementById('rejectedCount').textContent = requests.filter(r => r.status === 'rejected').length;
  document.getElementById('totalCount').textContent = requests.length;
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const list = requests.filter(r => !search || (r.student_name||'').toLowerCase().includes(search) || (r.student_code||'').includes(search));
  const el = document.getElementById('list');
  if (list.length === 0) {
    el.innerHTML = '<div class="empty">📭 لا توجد طلبات</div>';
    return;
  }
  const labels = { pending:'⏳ قيد الانتظار', approved:'✅ موافق', rejected:'❌ مرفوض' };
  el.innerHTML = list.map(r => `
    <div class="req-card ${esc(r.status)}">
      <div class="head">
        <div class="name">👨‍🎓 ${esc(r.student_name || '-')}</div>
        <span class="status ${esc(r.status)}">${labels[r.status]||r.status}</span>
      </div>
      <div class="meta">
        <div><div class="lbl">الكود</div>${esc(r.student_code||'-')}</div>
        <div><div class="lbl">تاريخ الطلب</div>${new Date(r.requested_at).toLocaleString('ar-EG')}</div>
      </div>
      <div class="reason"><strong>📝 السبب:</strong><br>${esc(r.reason)}</div>
      ${r.admin_response ? `<div class="response"><strong>📩 رد الإدارة:</strong> ${esc(r.admin_response)}</div>` : ''}
      <div class="actions">
        ${r.status === 'pending' ? `
          <button class="btn btn-green" onclick='openModal(${JSON.stringify(r.id)}, ${JSON.stringify(r.student_name||'')}, ${JSON.stringify(r.reason||'')})'>✅ معالجة</button>
        ` : ''}
        ${r.student_id ? `<a href="admin-student-detail.html?id=${r.student_id}" class="btn btn-blue">👁️ عرض الطالب</a>` : ''}
      </div>
    </div>`).join('');
}

function openModal(id, name, reason) {
  currentId = id;
  document.getElementById('modalStudent').textContent = 'الطالب: ' + name;
  document.getElementById('modalReason').textContent = '📝 ' + reason;
  document.getElementById('responseText').value = '';
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); currentId = null; }

async function submit(action) {
  if (!currentId) return;
  const resp = document.getElementById('responseText').value.trim();
  const { data: req, error } = await SB.from('reopen_requests').update({
    status: action,
    admin_response: resp || null,
    responded_at: new Date().toISOString(),
    admin_id: auth0.user.id
  }).eq('id', currentId).select('student_id,student_name').single();

  if (error) return Toast.show('خطأ: ' + error.message, 'error');

  if (action === 'approved' && req?.student_id) {
    const { error: e2 } = await SB.from('students').update({ is_locked: false, submitted_at: null }).eq('id', req.student_id);
    if (e2) return Toast.show('خطأ في فتح الطالب: ' + e2.message, 'error');
  }

  await SB.from('admin_logs').insert({
    admin_id: auth0.user.id, admin_email: auth0.user.email,
    action: action === 'approved' ? 'موافقة على طلب' : 'رفض طلب',
    details: (action === 'approved' ? 'فتح ' : 'رفض ') + (req?.student_name||''),
    student_id: req?.student_id, student_name: req?.student_name
  });

  Toast.show(`✅ تم ${action === 'approved' ? 'الموافقة' : 'الرفض'}`);
  closeModal();
  load();
}
</script>
</body>
</html>
